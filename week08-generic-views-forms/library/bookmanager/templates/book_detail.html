{% extends 'base.html' %}
{% block content %}
<h2>{{ object.title }}</h2>
<p><strong>Author:</strong> {{ object.author }}</p>
<p><strong>Published:</strong> {{ object.published_date }}</p>
<p><strong>Genre:</strong> {{ object.genre }}</p>
<a href="{% url 'book_edit' object.pk %}">Edit</a> |
<a href="{% url 'book_delete' object.pk %}">Delete</a>
{% endblock %}
