{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'mail/style.css' %}">
  <script src="{% static 'mail/script.js' %}"></script>
</head>
<body>
  <h2>Login</h2>

  <!-- Login Form -->
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>

  <!-- Navigation -->
  <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
</body>
</html>
