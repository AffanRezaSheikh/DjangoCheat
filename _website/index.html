     \"wind_speed\": s.wind_speed,\n                    }\n                    for s in reversed(list(qs))\n                ]\n    else:\n        form = CityForm()\n\n    return render(request, \"weather/dashboard.html\", {\n        \"form\": form,\n        \"current\": current,\n        \"forecast_points\": forecast_points,\n        \"historical_points\": historical_points,\n    })\n"}, "week10-weather-dashboard/weather_project/weather/urls.py": {"kind": "text", "text": "# weather/urls.py  (app level - create this file)\nfrom django.urls import path\nfrom .views import dashboard\n\nurlpatterns = [\n    path(\"\", dashboard, name=\"dashboard\"),\n]\n"}, "week10-weather-dashboard/weather_project/weather/utils.py": {"kind": "text", "text": "# weather/utils.py\n# From the manual (Step 3). The final views use services.py instead,\n# so this file is optional.\nimport requests\nfrom django.conf import settings\n\ndef fetch_weather(city, country_code=\"IN\"):\n    api_key = settings.OPENWEATHER_API_KEY\n    url = f\"https://api.openweathermap.org/data/2.5/weather?q={city},{country_code}&appid={api_key}&units=metric\"\n    response = requests.get(url)\n    data = response.json()\n    return {\n        \"city\": city,\n        \"country_code\": country_code,\n        \"temp_c\": data[\"main\"][\"temp\"],\n        \"humidity\": data[\"main\"][\"humidity\"],\n        \"wind_speed\": data[\"wind\"][\"speed\"],\n    }\n"}, "week10-weather-dashboard/weather_project/weather/static/weather/styles.css": {"kind": "text", "text": "body { font-family: system-ui, sans-serif; margin: 0; background: #f7f9fb; color: #2c3e50; }\n\n.container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }\n\n.city-form { display: flex; gap: 1rem; align-items: flex-end; }\n\n.city-form p { margin: 0; }\n\n.current-grid { display: grid; grid-template-columns: 1fr 120px; gap: 1rem; align-items: center; }\n\n.messages { list-style: none; padding: 0; }\n\n.messages li { margin: .5rem 0; padding: .5rem .75rem; border-radius: 6px; }\n\n.messages li.error { background: #fdecea; color: #c0392b; }\n\ncanvas { margin: 1rem 0; background: #fff; border: 1px solid #eaecef; border-radius: 8px; padding: .5rem; }\n"}, "week10-weather-dashboard/weather_project/weather/static/weather/charts.js": {"kind": "text", "text": "// weather/static/weather/charts.js\n// changed: the manual put an HTML demo here (see weather_trends_demo.html).\n// A .js file can only hold JavaScript, so this script reads the data that\n// dashboard.html outputs with json_script and draws the four charts.\n\nconst forecast = JSON.parse(document.getElementById(\"forecast-data\").textContent);\nconst historical = JSON.parse(document.getElementById(\"historical-data\").textContent);\n\nfunction drawLineChart(canvasId, labels, label, data, color) {\n  const canvas = document.getElementById(canvasId);\n  if (!canvas || data.length === 0) return;   // nothing to draw yet\n\n  new Chart(canvas, {\n    type: 'line',\n    data: {\n      labels: labels,\n      datasets: [{\n        label: label,\n        data: data,\n        borderColor: color,\n        backgroundColor: color,\n        fill: false,\n        tension: 0.3\n      }]\n    },\n    options: {\n      responsive: true,\n      plugins: {\n        legend: { position: 'top' },\n        tooltip: { enabled: true }\n      },\n      scales: {\n        x: { title: { display: true, text: 'Timestamp' } },\n        y: { title: { display: true, text: label } }\n      }\n    }\n  });\n}\n\n// 5-day forecast\ndrawLineChart(\"forecastTempChart\",\n  forecast.map(p => p.dt_txt), \"Temperature (°C)\", forecast.map(p => p.temp_c), \"red\");\ndrawLineChart(\"forecastHumidityChart\",\n  forecast.map(p => p.dt_txt), \"Humidity (%)\", forecast.map(p => p.humidity), \"blue\");\n\n// Saved snapshots (history)\ndrawLineChart(\"historicalTempChart\",\n  historical.map(p => p.time), \"Temperature (°C)\", historical.map(p => p.temp_c), \"red\");\ndrawLineChart(\"historicalWindChart\",\n  historical.map(p => p.time), \"Wind Speed (m/s)\", historical.map(p => p.wind_speed), \"green\");\n"}, "week10-weather-dashboard/weather_project/weather/templates/weather/dashboard.html": {"kind": "text", "text": "{% load static %}\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Weather dashboard<\/title>\n  <link rel=\"stylesheet\" href=\"{% static 'weather/styles.css' %}\">\n  <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"><\/script>\n<\/head>\n<body>\n  <main class=\"container\">\n    <h1>Weather dashboard<\/h1>\n\n    <form method=\"post\" class=\"city-form\">\n      {% csrf_token %}\n      {{ form.as_p }}\n      <button type=\"submit\">Update<\/button>\n    <\/form>\n\n    {% if messages %}\n      <ul class=\"messages\">\n        {% for m in messages %}\n          <li class=\"{{ m.tags }}\">{{ m }}<\/li>\n        {% endfor %}\n      <\/ul>\n    {% endif %}\n\n    {% if current %}\n      <section class=\"current\">\n        <h2>Current weather — {{ current.city }}<\/h2>\n        <div class=\"current-grid\">\n          <div>\n            <p><strong>Temperature:<\/strong> {{ current.temp_c }} °C<\/p>\n            <p><strong>Humidity:<\/strong> {{ current.humidity }} %<\/p>\n            <p><strong>Wind:<\/strong> {{ current.wind_speed }} m/s<\/p>\n            <p><strong>Conditions:<\/strong> {{ current.description }}<\/p>\n          <\/div>\n          <div>\n            <img alt=\"icon\" src=\"https://openweathermap.org/img/wn/{{ current.icon }}@2x.png\">\n          <\/div>\n        <\/div>\n      <\/section>\n    {% endif %}\n\n    <section class=\"charts\">\n      <h2>5-day forecast (3-hour intervals)<\/h2>\n      <canvas id=\"forecastTempChart\"><\/canvas>\n      <canvas id=\"forecastHumidityChart\"><\/canvas>\n\n      <h2>Local historical snapshots (last 30)<\/h2>\n      <canvas id=\"historicalTempChart\"><\/canvas>\n      <canvas id=\"historicalWindChart\"><\/canvas>\n    <\/section>\n  <\/main>\n\n  {{ forecast_points|json_script:\"forecast-data\" }}\n  {{ historical_points|json_script:\"historical-data\" }}\n  <script src=\"{% static 'weather/charts.js' %}\"><\/script>\n<\/body>\n<\/html>\n"}, "week09-mail-app/README.md": {"kind": "text", "text": "# Week 9 — Working with Mails\n\n**Aim:** Create an application for working with mails using the Django framework.\n\n## Project structure\n\n```text\nmail_app/\n├── manage.py\n├── mail_app/                  # settings (DB, email backend, auth) & root urls\n├── mail/\n│   ├── models.py              # Mail (sender, recipient, subject, body)\n│   ├── forms.py               # MailForm, RegisterForm\n│   ├── views.py               # inbox, compose, login, logout, register\n│   ├── urls.py\n│   └── templates/mail/\n│       ├── inbox.html\n│       ├── compose.html\n│       ├── login.html\n│       ├── register.html\n│       └── logout.html\n├── db.sqlite3\n└── static/mail/\n    ├── style.css\n    └── script.js\n```\n\n## Steps\n\n1. **Create an environment and the project:**\n\n   ```bash\n   python -m venv week9\n   week9\\Scripts\\activate\n   pip install django\n   django-admin startproject mail_app\n   cd mail_app\n   python manage.py startapp mail\n   ```\n\n2. **Get a Gmail App Password.** Turn on 2-Step Verification for your Google account, then create one at *Google Account → Security → App passwords*. Gmail rejects your normal password over SMTP.\n3. **Edit settings** in [mail_app/settings.py](open:week09-mail-app/mail_app/mail_app/settings.py): add `'mail'`, the SMTP settings with your Gmail address and App Password, the login/logout redirects, and the static folder.\n4. **Write the model** in [mail/models.py](open:week09-mail-app/mail_app/mail/models.py).\n5. **Write the forms** in [mail/forms.py](open:week09-mail-app/mail_app/mail/forms.py): `MailForm` (recipient, subject, body) and `RegisterForm`.\n6. **Write the views** in [mail/views.py](open:week09-mail-app/mail_app/mail/views.py). `compose_view` sends the mail with `send_mail(subject, body, settings.EMAIL_HOST_USER, [recipient])` and then saves a copy in the database.\n7. **Map the URLs** in [mail/urls.py](open:week09-mail-app/mail_app/mail/urls.py) (app level) and [mail_app/urls.py](open:week09-mail-app/mail_app/mail_app/urls.py) (project level).\n8. **Create the templates** in `mail/templates/mail/`: [register.html](open:week09-mail-app/mail_app/mail/templates/mail/register.html), [login.html](open:week09-mail-app/mail_app/mail/templates/mail/login.html), [inbox.html](open:week09-mail-app/mail_app/mail/templates/mail/inbox.html), [compose.html](open:week09-mail-app/mail_app/mail/templates/mail/compose.html) and [logout.html](open:week09-mail-app/mail_app/mail/templates/mail/logout.html).\n9. **Add the static files** [static/mail/style.css](open:week09-mail-app/mail_app/static/mail/style.css) and [static/mail/script.js](open:week09-mail-app/mail_app/static/mail/script.js) (confirm before sending, toast message, hover highlight, password show/hide).\n10. **Run the application:**\n\n    ```bash\n    python manage.py makemigrations\n    python manage.py migrate\n    python manage.py createsuperuser\n    python manage.py collectstatic\n    python manage.py runserver\n    ```\n\n    Register at http://127.0.0.1:8000/register/, then compose a mail ([screenshot](open:week09-mail-app/output/compose.jpg)). It arrives in the recipient's inbox and is listed on your Inbox page.\n"}, "week09-mail-app/mail_app/static/mail/style.css": {"kind": "text", "text": "/* General page styling */\nbody {\n  font-family: Arial, sans-serif;\n  background-color: #f4f6f9;\n  margin: 0;\n  padding: 0;\n}\n\n/* Header */\nh2 {\n  color: #333;\n  text-align: center;\n  margin-top: 20px;\n}\n\n/* Form styling */\nform {\n  max-width: 400px;\n  margin: 20px auto;\n  padding: 20px;\n  background: #fff;\n  border-radius: 8px;\n  box-shadow: 0px 2px 6px rgba(0,0,0,0.1);\n}\n\nform input, form textarea, form button {\n  width: 100%;\n  padding: 10px;\n  margin: 8px 0;\n  border-radius: 5px;\n  border: 1px solid #ccc;\n}\n\n/* Buttons */\nbutton {\n  background-color: #007bff;\n  color: white;\n  border: none;\n  cursor: pointer;\n  font-weight: bold;\n}\n\nbutton:hover {\n  background-color: #0056b3;\n}\n\n/* Inbox list */\nul {\n  list-style-type: none;\n  padding: 0;\n}\n\nul li {\n  background: #fff;\n  margin: 10px auto;\n  padding: 15px;\n  border-radius: 6px;\n  max-width: 600px;\n  box-shadow: 0px 2px 4px rgba(0,0,0,0.1);\n}\n\nul li b {\n  color: #007bff;\n}\n\n/* Navigation links */\na {\n  color: #007bff;\n  text-decoration: none;\n}\n\na:hover {\n  text-decoration: underline;\n}\n"}, "week09-mail-app/mail_app/static/mail/script.js": {"kind": "text", "text": "// Wait until the DOM is fully loaded\ndocument.addEventListener(\"DOMContentLoaded\", function() {\n\n  // Confirmation before sending mail\n  const composeForm = document.querySelector(\"form\");\n\n  if (composeForm && window.location.pathname.includes(\"compose\")) {\n    composeForm.addEventListener(\"submit\", function(event) {\n      const confirmSend = confirm(\"Are you sure you want to send this mail?\");\n      if (!confirmSend) {\n        event.preventDefault(); // cancel submission\n      } else {\n        // Show toast notification after sending\n        showToast(\"✅ Mail sent successfully!\");\n      }\n    });\n  }\n\n  // Highlight inbox items on hover\n  const inboxItems = document.querySelectorAll(\"ul li\");\n\n  inboxItems.forEach(item => {\n    item.addEventListener(\"mouseover\", () => {\n      item.style.backgroundColor = \"#e9f5ff\"; // light blue highlight\n    });\n    item.addEventListener(\"mouseout\", () => {\n      item.style.backgroundColor = \"#fff\"; // reset\n    });\n  });\n\n  // Auto-focus first input field (login/register/compose)\n  const firstInput = document.querySelector(\"form input\");\n  if (firstInput) {\n    firstInput.focus();\n  }\n\n  // Password visibility toggle (login/register forms)\n  const passwordFields = document.querySelectorAll(\"input[type='password']\");\n\n  passwordFields.forEach(field => {\n    const toggle = document.createElement(\"span\");\n    toggle.textContent = \"👁\";\n    toggle.style.cursor = \"pointer\";\n    toggle.style.marginLeft = \"10px\";\n    field.parentNode.appendChild(toggle);\n\n    toggle.addEventListener(\"click\", () => {\n      field.type = field.type === \"password\" ? \"text\" : \"password\";\n    });\n  });\n\n  // Toast notification function\n  function showToast(message) {\n    const toast = document.createElement(\"div\");\n    toast.textContent = message;\n    toast.style.position = \"fixed\";\n    toast.style.bottom = \"20px\";\n    toast.style.right = \"20px\";\n    toast.style.background = \"#28a745\";\n    toast.style.color = \"#fff\";\n    toast.style.padding = \"10px 20px\";\n    toast.style.borderRadius = \"5px\";\n    toast.style.boxShadow = \"0px 2px 6px rgba(0,0,0,0.2)\";\n    document.body.appendChild(toast);\n\n    setTimeout(() => toast.remove(), 3000); // disappear after 3s\n  }\n});\n"}, "week09-mail-app/mail_app/mail/models.py": {"kind": "text", "text": "# mail/models.py\nfrom django.db import models\nfrom django.contrib.auth.models import User\n\nclass Mail(models.Model):\n    sender = models.EmailField()\n    recipient = models.EmailField()\n    subject = models.CharField(max_length=255)\n    body = models.TextField()\n    timestamp = models.DateTimeField(auto_now_add=True)\n    owner = models.ForeignKey(User, on_delete=models.CASCADE)\n\n    def __str__(self):\n        return f\"{self.subject} ({self.sender} → {self.recipient})\"\n"}, "week09-mail-app/mail_app/mail/forms.py": {"kind": "text", "text": "# mail/forms.py  (create this file)\nfrom django import forms\nfrom django.contrib.auth.models import User\nfrom django.contrib.auth.forms import UserCreationForm\n\n# added: views.py imports MailForm, but the manual never defines it\nclass MailForm(forms.Form):\n    recipient = forms.EmailField()\n    subject = forms.CharField(max_length=255)\n    body = forms.CharField(widget=forms.Textarea)\n\nclass RegisterForm(UserCreationForm):\n    email = forms.EmailField(required=True)\n\n    class Meta:\n        model = User\n        fields = [\"username\", \"email\", \"password1\", \"password2\"]\n"}, "week09-mail-app/mail_app/mail/views.py": {"kind": "text", "text": "# mail/views.py\nfrom django.shortcuts import render, redirect\nfrom django.contrib.auth.decorators import login_required\nfrom django.contrib.auth import login, logout\nfrom django.contrib.auth.forms import AuthenticationForm\nfrom django.core.mail import send_mail\nfrom django.conf import settings\nfrom .forms import MailForm, RegisterForm\nfrom .models import Mail\n\n# Inbox View\n@login_required\ndef inbox_view(request):\n    mails = Mail.objects.filter(owner=request.user).order_by('-timestamp')\n    return render(request, \"mail/inbox.html\", {\"mails\": mails})\n\n# ✉ Compose Mail View\n@login_required\ndef compose_view(request):\n    if request.method == \"POST\":\n        form = MailForm(request.POST)\n        if form.is_valid():\n            recipient = form.cleaned_data['recipient']\n            subject = form.cleaned_data['subject']\n            body = form.cleaned_data['body']\n\n            # Send email via SMTP\n            send_mail(subject, body, settings.EMAIL_HOST_USER, [recipient])\n\n            # Save to DB\n            Mail.objects.create(\n                sender=settings.EMAIL_HOST_USER,\n                recipient=recipient,\n                subject=subject,\n                body=body,\n                owner=request.user\n            )\n            return redirect(\"inbox\")\n    else:\n        form = MailForm()\n    return render(request, \"mail/compose.html\", {\"form\": form})\n\n# Login View\ndef login_view(request):\n    if request.method == \"POST\":\n        form = AuthenticationForm(request, data=request.POST)\n        if form.is_valid():\n            user = form.get_user()\n            login(request, user)\n            return redirect(\"inbox\")\n    else:\n        form = AuthenticationForm()\n    return render(request, \"mail/login.html\", {\"form\": form})\n\n# Logout View\n@login_required\ndef logout_view(request):\n    logout(request)\n    return redirect(\"login\")\n\n# Register View\ndef register_view(request):\n    if request.method == \"POST\":\n        form = RegisterForm(request.POST)\n        if form.is_valid():\n            user = form.save()\n            login(request, user)  # auto-login after registration\n            return redirect(\"inbox\")\n    else:\n        form = RegisterForm()\n    return render(request, \"mail/register.html\", {\"form\": form})\n"}, "week09-mail-app/mail_app/mail/urls.py": {"kind": "text", "text": "# mail/urls.py  (app level - create this file)\nfrom django.urls import path\nfrom . import views\n\nurlpatterns = [\n    path('inbox/', views.inbox_view, name='inbox'),\n    path('compose/', views.compose_view, name='compose'),\n    path('login/', views.login_view, name='login'),\n    path('logout/', views.logout_view, name='logout'),\n    path('register/', views.register_view, name='register'),\n]\n"}, "week09-mail-app/mail_app/mail/templates/mail/inbox.html": {"kind": "text", "text": "{% load static %}\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Inbox<\/title>\n  <link rel=\"stylesheet\" href=\"{% static 'mail/style.css' %}\">\n  <script src=\"{% static 'mail/script.js' %}\"><\/script>\n<\/head>\n<body>\n  <h2>Your Inbox<\/h2>\n\n  <!-- Navigation -->\n  <p>\n    <a href=\"{% url 'compose' %}\">Compose Mail<\/a> |\n    <a href=\"{% url 'logout' %}\">Logout<\/a>\n  <\/p>\n\n  <!-- Inbox List -->\n  <ul>\n    {% for mail in mails %}\n      <li>\n        <b>{{ mail.subject }}<\/b><br>\n        From: {{ mail.sender }} → To: {{ mail.recipient }}<br>\n        <small>{{ mail.timestamp }}<\/small><br>\n        <p>{{ mail.body|truncatewords:20 }}<\/p>\n      <\/li>\n    {% empty %}\n      <li>No mails yet.<\/li>\n    {% endfor %}\n  <\/ul>\n<\/body>\n<\/html>\n"}, "week09-mail-app/mail_app/mail/templates/mail/login.html": {"kind": "text", "text": "{% load static %}\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Login<\/title>\n  <link rel=\"stylesheet\" href=\"{% static 'mail/style.css' %}\">\n  <script src=\"{% static 'mail/script.js' %}\"><\/script>\n<\/head>\n<body>\n  <h2>Login<\/h2>\n\n  <!-- Login Form -->\n  <form method=\"post\">\n    {% csrf_token %}\n    {{ form.as_p }}\n    <button type=\"submit\">Login<\/button>\n  <\/form>\n\n  <!-- Navigation -->\n  <p>Don't have an account? <a href=\"{% url 'register' %}\">Register here<\/a><\/p>\n<\/body>\n<\/html>\n"}, "week09-mail-app/mail_app/mail/templates/mail/logout.html": {"kind": "text", "text": "{% load static %}\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Logout<\/title>\n  <link rel=\"stylesheet\" href=\"{% static 'mail/style.css' %}\">\n<\/head>\n<body>\n  <h2>You have been logged out<\/h2>\n  <p><a href=\"{% url 'login' %}\">Login again<\/a><\/p>\n<\/body>\n<\/html>\n"}, "week09-mail-app/mail_app/mail/templates/mail/compose.html": {"kind": "text", "text": "{% load static %}\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Compose Mail<\/title>\n  <link rel=\"stylesheet\" href=\"{% static 'mail/style.css' %}\">\n  <script src=\"{% static 'mail/script.js' %}\"><\/script>\n<\/head>\n<body>\n  <h2>Compose Mail<\/h2>\n\n  <!-- Navigation -->\n  <p>\n    <a href=\"{% url 'inbox' %}\">Inbox<\/a> |\n    <a href=\"{% url 'logout' %}\">Logout<\/a>\n  <\/p>\n\n  <!-- Compose Form -->\n  <form method=\"post\">\n    {% csrf_token %}\n    {{ form.as_p }}\n    <button type=\"submit\">Send Mail<\/button>\n  <\/form>\n<\/body>\n<\/html>\n"}, "week09-mail-app/mail_app/mail/templates/mail/register.html": {"kind": "text", "text": "{% load static %}\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Register<\/title>\n  <link rel=\"stylesheet\" href=\"{% static 'mail/style.css' %}\">\n  <script src=\"{% static 'mail/script.js' %}\"><\/script>\n<\/head>\n<body>\n  <h2>Create an Account<\/h2>\n\n  <!-- Registration Form -->\n  <form method=\"post\">\n    {% csrf_token %}\n    {{ form.as_p }}\n    <button type=\"submit\">Register<\/button>\n  <\/form>\n\n  <!-- Navigation -->\n  <p>Already have an account? <a href=\"{% url 'login' %}\">Login here<\/a><\/p>\n<\/body>\n<\/html>\n"}, "week09-mail-app/mail_app/mail_app/settings.py": {"kind": "text", "text": "# mail_app/settings.py\n# Only the parts you change are shown. Keep everything else that\n# \"django-admin startproject\" generated.\n\nINSTALLED_APPS = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'mail',  # our app\n]\n\n# Email backend (SMTP example: Gmail)\n# Django 6.1 or newer: startproject also adds a \"MAILERS = {...}\" block.\n# Delete that block, otherwise Django refuses to start with these EMAIL_ settings.\nEMAIL_BACKEND = 'django.core.mail.backends.smtp.EmailBackend'\nEMAIL_HOST = 'smtp.gmail.com'\nEMAIL_PORT = 587\nEMAIL_USE_TLS = True\nEMAIL_HOST_USER = 'your_email@gmail.com'\nEMAIL_HOST_PASSWORD = 'your_password_or_app_password'  # use a Gmail App Password\n\nLOGIN_URL = '/login/'             # added: where @login_required sends users\nLOGIN_REDIRECT_URL = '/inbox/'    # after login, go to inbox\nLOGOUT_REDIRECT_URL = '/login/'   # after logout, go to login page\n\n# added: the project-level static/ folder holds mail/style.css and mail/script.js\nSTATIC_URL = 'static/'\nSTATICFILES_DIRS = [BASE_DIR / 'static']\nSTATIC_ROOT = BASE_DIR / 'staticfiles'   # needed for \"collectstatic\"\n"}, "week09-mail-app/mail_app/mail_app/urls.py": {"kind": "text", "text": "# mail_app/urls.py  (project level)\nfrom django.contrib import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', include('mail.urls')),\n]\n"}, "week01-registration-form/registration_static.html": {"kind": "text", "text": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n <meta charset=\"UTF-8\">\n <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n <title>Registration Form<\/title>\n<\/head>\n<body>\n <h2>Registration Form<\/h2>\n <form>\n  <p>\n    <label for=\"username\">User Name:<\/label><br>\n    <input type=\"text\" id=\"username\" name=\"username\" required>\n  <\/p>\n  <p>\n    <label for=\"password\">Password:<\/label><br>\n    <input type=\"password\" id=\"password\" name=\"password\" required>\n  <\/p>\n  <p>\n    <label for=\"dob\">Date of Birth:<\/label><br>\n    <input type=\"date\" id=\"dob\" name=\"dob\" required>\n  <\/p>\n  <p>\n    <label>Gender:<\/label><br>\n    <input type=\"radio\" name=\"gender\" value=\"male\" required> Male\n    <input type=\"radio\" name=\"gender\" value=\"female\" required> Female\n    <input type=\"radio\" name=\"gender\" value=\"other\" required> Other\n  <\/p>\n  <p>\n    <label for=\"email\">Mail-id:<\/label><br>\n    <input type=\"email\" id=\"email\" name=\"email\" required>\n  <\/p>\n  <p>\n    <label for=\"contact\">Contact Number:<\/label><br>\n    <input type=\"tel\" id=\"contact\" name=\"contact\" pattern=\"[0-9]{10}\" placeholder=\"10-digit number\" required>\n  <\/p>\n  <p>\n    <label for=\"address\">Address:<\/label><br>\n    <textarea id=\"address\" name=\"address\" rows=\"3\" required><\/textarea>\n  <\/p>\n  <p>\n    <button type=\"submit\">Submit<\/button>\n  <\/p>\n <\/form>\n<\/body>\n<\/html>\n"}, "week01-registration-form/README.md": {"kind": "text", "text": "# Week 1 — Responsive Registration Form\n\n**Aim:** Build a responsive web application for a registration form which contains User Name, Password, Date of Birth, Gender, Mail-id, Contact Number, Address and a Submit button.\n\n## Steps\n\n1. **Make a folder** for the week, for example `week1`, and open it in VS Code (*File → Open Folder*).\n2. **Write the static form.** Create [registration_static.html](open:week01-registration-form/registration_static.html). It uses plain HTML inputs: `text`, `password`, `date`, `radio`, `email`, `tel` (with `pattern=\"[0-9]{10}\"`) and a `textarea`. Every field has `required`, so the browser blocks an empty submit.\n3. **Open it in a browser** (double-click the file, or right-click → *Open with Live Server*). You get the unstyled form shown in [output/static-form.jpg](open:week01-registration-form/output/static-form.jpg).\n4. **Write the responsive version.** Create [registration_responsive.html](open:week01-registration-form/registration_responsive.html). The `<style>` block:\n   - centres the card with `display: flex; justify-content: center; align-items: center; min-height: 100vh`\n   - limits the card to `max-width: 500px; width: 100%`\n   - lays out the gender radios in a row with `.radio-inline { display: flex; gap: 20px }`\n   - shrinks padding and heading size under 600px with `@media (max-width: 600px)`\n5. **Add the submit script.** The `<script>` at the bottom stops the real submit with `event.preventDefault()` and shows *Form submitted successfully!*\n6. **Test it.** Open the file, resize the window (or press `F12` → device toolbar) and check the layout at phone width. Compare with [output/responsive-form.jpg](open:week01-registration-form/output/responsive-form.jpg).\n"}, "week01-registration-form/registration_responsive.html": {"kind": "text", "text": "<!--WEEK1: Build a Responsive Web Application for Registration Form, which\ncontains User Name, Password, Date of Birth, Gender, Mail-id, Contact Number,\nAddress and Submit Button-->\n\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n <meta charset=\"UTF-8\">\n <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n <title>Registration Form<\/title>\n <style>\n  body {\n      font-family: Arial, sans-serif;\n      background: #f4f7f8;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      margin: 0;\n  }\n\n  .container {\n      background: #fff;\n      padding: 20px 30px;\n      border-radius: 8px;\n      box-shadow: 0 4px 8px rgba(0,0,0,0.1);\n      max-width: 500px;\n      width: 100%;\n  }\n\n  h2 {\n      text-align: center;\n      margin-bottom: 20px;\n      color: #333;\n  }\n\n  .form-group {\n      margin-bottom: 15px;\n  }\n\n  label {\n      display: block;\n      margin-bottom: 5px;\n      font-weight: bold;\n      color: #555;\n  }\n\n  input, select, textarea {\n      width: 100%;\n      padding: 10px;\n      border: 1px solid #ccc;\n      border-radius: 5px;\n      font-size: 14px;\n  }\n\n  textarea {\n      resize: vertical;\n  }\n\n  .radio-inline {\n      display: flex;\n      gap: 20px; /* spacing between options */\n      margin-top: 8px;\n  }\n\n  .radio-inline label {\n      display: flex;\n      align-items: center;\n      font-size: 14px;\n      cursor: pointer;\n  }\n\n  .radio-inline input[type=\"radio\"] {\n      margin-right: 6px;\n  }\n\n  button {\n      width: 100%;\n      padding: 12px;\n      background: #007BFF;\n      color: #fff;\n      border: none;\n      border-radius: 5px;\n      font-size: 16px;\n      cursor: pointer;\n  }\n\n  button:hover {\n      background: #0056b3;\n  }\n\n  /* Responsive Design */\n  @media (max-width: 600px) {\n      .container {\n          padding: 15px;\n      }\n      h2 {\n          font-size: 20px;\n      }\n  }\n <\/style>\n<\/head>\n<body>\n <div class=\"container\">\n  <h2>Registration Form<\/h2>\n  <form id=\"registrationForm\">\n    <div class=\"form-group\">\n      <label for=\"username\">User Name<\/label>\n      <input type=\"text\" id=\"username\" name=\"username\" required>\n    <\/div>\n\n    <div class=\"form-group\">\n      <label for=\"password\">Password<\/label>\n      <input type=\"password\" id=\"password\" name=\"password\" required>\n    <\/div>\n\n    <div class=\"form-group\">\n      <label for=\"dob\">Date of Birth<\/label>\n      <input type=\"date\" id=\"dob\" name=\"dob\" required>\n    <\/div>\n\n    <div class=\"form-group\">\n      <div class=\"radio-inline\">\n        <label>Gender:<\/label>\n        <input type=\"radio\" name=\"gender\" value=\"male\" required>Male\n        <input type=\"radio\" name=\"gender\" value=\"female\" required>Female\n        <input type=\"radio\" name=\"gender\" value=\"other\" required>Other\n      <\/div>\n    <\/div>\n\n    <div class=\"form-group\">\n      <label for=\"email\">Mail-id<\/label>\n      <input type=\"email\" id=\"email\" name=\"email\" required>\n    <\/div>\n\n    <div class=\"form-group\">\n      <label for=\"contact\">Contact Number<\/label>\n      <input type=\"tel\" id=\"contact\" name=\"contact\" pattern=\"[0-9]{10}\" placeholder=\"10-digit number\" required>\n    <\/div>\n\n    <div class=\"form-group\">\n      <label for=\"address\">Address<\/label>\n      <textarea id=\"address\" name=\"address\" rows=\"3\" required><\/textarea>\n    <\/div>\n\n    <button type=\"submit\">Submit<\/button>\n  <\/form>\n <\/div>\n <script>\n  document.getElementById(\"registrationForm\").addEventListener(\"submit\", function(event) {\n    event.preventDefault(); // Prevent form submission for demo\n    alert(\"Form submitted successfully!\");\n  });\n <\/script>\n<\/body>\n<\/html>\n"}, "week08-generic-views-forms/README.md": {"kind": "text", "text": "# Week 8 — Generic Views and Forms\n\n**Aim:** Create a Django application using generic views and forms.\n\n**Generic views** are part of Django's class-based views (CBVs). They handle common patterns — listing objects, showing details, creating, updating and deleting records.\n\n| View type | Purpose | Class name |\n|---|---|---|\n| List View | Display a list of objects | `ListView` |\n| Detail View | Show details of a single object | `DetailView` |\n| Create View | Handle the form for creating an object | `CreateView` |\n| Update View | Handle the form for updating an object | `UpdateView` |\n| Delete View | Confirm and delete an object | `DeleteView` |\n\n**Generic forms** are Django's built-in form classes that simplify form creation and handling.\n\n| Form type | Description |\n|---|---|\n| `Form` | Basic form with manually defined fields |\n| `ModelForm` | Auto-generates fields from a Django model |\n| `FormView` | Generic view for displaying and processing forms |\n\n## Steps\n\n1. **Create the project and app:**\n\n   ```bash\n   python -m venv week8\n   week8\\Scripts\\activate\n   pip install django\n   django-admin startproject library\n   cd library\n   python manage.py startapp bookmanager\n   ```\n\n   Add `'bookmanager'` to `INSTALLED_APPS` in [library/settings.py](open:week08-generic-views-forms/library/library/settings.py).\n2. **Write the model** in [bookmanager/models.py](open:week08-generic-views-forms/library/bookmanager/models.py): `Book` with title, author, published_date and genre.\n3. **Create the tables:**\n\n   ```bash\n   python manage.py makemigrations\n   python manage.py migrate\n   ```\n\n4. **Write the form** in [bookmanager/forms.py](open:week08-generic-views-forms/library/bookmanager/forms.py): a `ModelForm` for `Book`.\n5. **Write the generic views** in [bookmanager/views.py](open:week08-generic-views-forms/library/bookmanager/views.py). Each class only sets `model`, `template_name` and, for create/update/delete, `success_url = reverse_lazy('book_list')`.\n6. **Map the URLs** in [bookmanager/urls.py](open:week08-generic-views-forms/library/bookmanager/urls.py). Class-based views are added with `.as_view()`; `<int:pk>` passes the book's id.\n7. **Include them** in the main [library/urls.py](open:week08-generic-views-forms/library/library/urls.py).\n8. **Create the templates** in `bookmanager/templates/`:\n   1. [base.html](open:week08-generic-views-forms/library/bookmanager/templates/base.html)\n   2. [book_list.html](open:week08-generic-views-forms/library/bookmanager/templates/book_list.html) — loops over `object_list`\n   3. [book_detail.html](open:week08-generic-views-forms/library/bookmanager/templates/book_detail.html) — shows `object`\n   4. [book_form.html](open:week08-generic-views-forms/library/bookmanager/templates/book_form.html) — used for both Add and Edit\n   5. [book_confirm_delete.html](open:week08-generic-views-forms/library/bookmanager/templates/book_confirm_delete.html)\n9. **Run the application:**\n\n   ```bash\n   python manage.py runserver\n   ```\n\n   Add a book (type the date as `2008-11-18`), open it, edit it and delete it. Compare with the [output screenshots](open:week08-generic-views-forms/output/book-list.jpg).\n"}, "week08-generic-views-forms/library/library/settings.py": {"kind": "text", "text": "# library/settings.py\n# Only the part you change is shown. Keep everything else that\n# \"django-admin startproject\" generated.\n\nINSTALLED_APPS = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'bookmanager',\n]\n"}, "week08-generic-views-forms/library/library/urls.py": {"kind": "text", "text": "# library/urls.py  (main / project level)\nfrom django.contrib import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', include('bookmanager.urls')),\n]\n"}, "week08-generic-views-forms/library/bookmanager/models.py": {"kind": "text", "text": "# bookmanager/models.py\nfrom django.db import models\n\nclass Book(models.Model):\n    title = models.CharField(max_length=200)\n    author = models.CharField(max_length=100)\n    published_date = models.DateField()\n    genre = models.CharField(max_length=50)\n\n    def __str__(self):\n        return self.title\n"}, "week08-generic-views-forms/library/bookmanager/forms.py": {"kind": "text", "text": "# bookmanager/forms.py  (create this file)\nfrom django import forms\nfrom .models import Book\n\nclass BookForm(forms.ModelForm):\n    class Meta:\n        model = Book\n        fields = ['title', 'author', 'published_date', 'genre']\n"}, "week08-generic-views-forms/library/bookmanager/views.py": {"kind": "text", "text": "# bookmanager/views.py\nfrom django.views.generic import ListView, DetailView, CreateView, UpdateView, DeleteView\nfrom django.urls import reverse_lazy\nfrom .models import Book\nfrom .forms import BookForm\n\nclass BookListView(ListView):\n    model = Book\n    template_name = 'book_list.html'\n\nclass BookDetailView(DetailView):\n    model = Book\n    template_name = 'book_detail.html'\n\nclass BookCreateView(CreateView):\n    model = Book\n    form_class = BookForm\n    template_name = 'book_form.html'\n    success_url = reverse_lazy('book_list')\n\nclass BookUpdateView(UpdateView):\n    model = Book\n    form_class = BookForm\n    template_name = 'book_form.html'\n    success_url = reverse_lazy('book_list')\n\nclass BookDeleteView(DeleteView):\n    model = Book\n    template_name = 'book_confirm_delete.html'\n    success_url = reverse_lazy('book_list')\n"}, "week08-generic-views-forms/library/bookmanager/urls.py": {"kind": "text", "text": "# bookmanager/urls.py  (create this file)\nfrom django.urls import path\nfrom .views import BookListView, BookDetailView, BookCreateView, BookUpdateView, BookDeleteView\n\nurlpatterns = [\n    path('', BookListView.as_view(), name='book_list'),\n    path('book/<int:pk>/', BookDetailView.as_view(), name='book_detail'),\n    path('book/add/', BookCreateView.as_view(), name='book_add'),\n    path('book/<int:pk>/edit/', BookUpdateView.as_view(), name='book_edit'),\n    path('book/<int:pk>/delete/', BookDeleteView.as_view(), name='book_delete'),\n]\n"}, "week08-generic-views-forms/library/bookmanager/templates/book_confirm_delete.html": {"kind": "text", "text": "{% extends 'base.html' %}\n{% block content %}\n<h2>Confirm Delete<\/h2>\n<p>Are you sure you want to delete \"{{ object.title }}\"?<\/p>\n<form method=\"post\">\n  {% csrf_token %}\n  <button type=\"submit\">Yes, delete<\/button>\n  <a href=\"{% url 'book_list' %}\">Cancel<\/a>\n<\/form>\n{% endblock %}\n"}, "week08-generic-views-forms/library/bookmanager/templates/book_form.html": {"kind": "text", "text": "{% extends 'base.html' %}\n{% block content %}\n<h2>{% if object %}Edit{% else %}Add{% endif %} Book<\/h2>\n<form method=\"post\">\n  {% csrf_token %}\n  {{ form.as_p }}\n  <button type=\"submit\">Save<\/button>\n<\/form>\n{% endblock %}\n"}, "week08-generic-views-forms/library/bookmanager/templates/book_detail.html": {"kind": "text", "text": "{% extends 'base.html' %}\n{% block content %}\n<h2>{{ object.title }}<\/h2>\n<p><strong>Author:<\/strong> {{ object.author }}<\/p>\n<p><strong>Published:<\/strong> {{ object.published_date }}<\/p>\n<p><strong>Genre:<\/strong> {{ object.genre }}<\/p>\n<a href=\"{% url 'book_edit' object.pk %}\">Edit<\/a> |\n<a href=\"{% url 'book_delete' object.pk %}\">Delete<\/a>\n{% endblock %}\n"}, "week08-generic-views-forms/library/bookmanager/templates/base.html": {"kind": "text", "text": "<!DOCTYPE html>\n<html>\n<head>\n  <title>Book Manager<\/title>\n<\/head>\n<body>\n  <h1>Book Manager<\/h1>\n  <nav>\n    <a href=\"{% url 'book_list' %}\">Home<\/a> |\n    <a href=\"{% url 'book_add' %}\">Add Book<\/a>\n  <\/nav>\n  <hr>\n  {% block content %}{% endblock %}\n<\/body>\n<\/html>\n"}, "week08-generic-views-forms/library/bookmanager/templates/book_list.html": {"kind": "text", "text": "{% extends 'base.html' %}\n{% block content %}\n<h2>Book List<\/h2>\n<ul>\n  {% for book in object_list %}\n    <li>\n      <a href=\"{% url 'book_detail' book.pk %}\">{{ book.title }}<\/a> by {{ book.author }}\n    <\/li>\n  {% empty %}\n    <li>No books available.<\/li>\n  {% endfor %}\n<\/ul>\n{% endblock %}\n"}, "week04-django-basics/README.md": {"kind": "text", "text": "# Week 4 — Basics of Django & Installing the Software\n\n**Aim:** Learn the basics of the Django framework and install the required software.\n\n## Steps\n\n1. **Install Python** (latest version) and check it:\n\n   ```bash\n   python --version\n   pip --version\n   ```\n\n   Make a parent folder for all your Django projects:\n\n   ```bash\n   mkdir my_django_project\n   cd my_django_project\n   ```\n\n2. **Create and activate a virtual environment.** `venv` comes with Python, so nothing extra is needed.\n\n   ```bash\n   python -m venv week4\n   week4\\Scripts\\activate          # Command Prompt\n   week4\\Scripts\\Activate.ps1      # PowerShell\n   ```\n\n   Your prompt now starts with `(week4)`.\n3. **Install Django** and check the version:\n\n   ```bash\n   pip install django\n   django-admin --version\n   ```\n\n4. **Create the project** `website` and run it once:\n\n   ```bash\n   django-admin startproject website\n   cd website\n   python manage.py runserver\n   ```\n\n   Open http://127.0.0.1:8000 — the Django welcome page means Django is installed. Press `Ctrl+C` to stop.\n5. **Create an app** called `myapp`:\n\n   ```bash\n   python manage.py startapp myapp\n   ```\n\n6. **Make the template and static folders** inside `myapp`:\n\n   ```text\n   website/\n   ├── myapp/\n   │   ├── templates/myapp/index.html\n   │   └── static/myapp/\n   │       ├── style.css\n   │       └── script.js\n   ```\n\n   Add [index.html](open:week04-django-basics/website/myapp/templates/myapp/index.html), [style.css](open:week04-django-basics/website/myapp/static/myapp/style.css) and [script.js](open:week04-django-basics/website/myapp/static/myapp/script.js). `{% load static %}` must be the first line of the template.\n\n   **Django templates** are HTML files with Django's own template language (DTL). They let you insert dynamic data with `{{ variable }}`, control logic with `{% tags %}` such as loops and conditionals, and extend base layouts with `{% extends %}` and `{% block %}`.\n7. **Configure templates and static files** in [website/settings.py](open:week04-django-basics/website/website/settings.py): set `TEMPLATES['DIRS']`, `STATIC_URL` and `STATICFILES_DIRS`.\n8. **Register the app** by adding `'myapp'` to `INSTALLED_APPS` in the same file.\n9. **Write the view.** [myapp/views.py](open:week04-django-basics/website/myapp/views.py) holds view functions — they process a request and return a response (render a template, read the database, handle a form or return JSON).\n10. **Map the URLs.** `urls.py` connects a URL to a view.\n    - Create [myapp/urls.py](open:week04-django-basics/website/myapp/urls.py) — routes for this one app.\n    - Edit [website/urls.py](open:week04-django-basics/website/website/urls.py) — the project's central dispatcher — and `include('myapp.urls')`.\n11. **Run the project:**\n\n    ```bash\n    python manage.py runserver\n    ```\n\n    Open http://127.0.0.1:8000 and click **Click Me**. See [output/welcome.jpg](open:week04-django-basics/output/welcome.jpg) and [output/after-click.jpg](open:week04-django-basics/output/after-click.jpg).\n"}, "week04-django-basics/website/myapp/views.py": {"kind": "text", "text": "# myapp/views.py\nfrom django.shortcuts import render\n\ndef index(request):\n    return render(request, 'myapp/index.html')\n"}, "week04-django-basics/website/myapp/urls.py": {"kind": "text", "text": "# myapp/urls.py  (create this file - startapp does not make it)\nfrom django.urls import path\nfrom . import views\n\nurlpatterns = [\n    path('', views.index, name='index'),\n]\n"}, "week04-django-basics/website/myapp/static/myapp/style.css": {"kind": "text", "text": "body {\n  font-family: Arial;\n  background-color: #f0f0f0;\n}\n\nbutton {\n  padding: 10px;\n  background-color: #007bff;\n  color: white;\n  border: none;\n}\n"}, "week04-django-basics/website/myapp/static/myapp/script.js": {"kind": "text", "text": "function showMessage() {\n  document.getElementById(\"output\").innerText = \"Hello from JavaScript!\";\n}\n"}, "week04-django-basics/website/myapp/templates/myapp/index.html": {"kind": "text", "text": "{% load static %}\n<!DOCTYPE html>\n<html>\n<head>\n  <link rel=\"stylesheet\" href=\"{% static 'myapp/style.css' %}\">\n  <script src=\"{% static 'myapp/script.js' %}\"><\/script>\n<\/head>\n<body>\n  <h1>Welcome to My Django App<\/h1>\n  <button onclick=\"showMessage()\">Click Me<\/button>\n  <p id=\"output\"><\/p>\n<\/body>\n<\/html>\n"}, "week04-django-basics/website/website/settings.py": {"kind": "text", "text": "# website/settings.py\n# Only the parts you change are shown. Keep everything else that\n# \"django-admin startproject\" generated.\n\n# Step 6: Application definition\nINSTALLED_APPS = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'myapp',\n]\n\n# Step 5: Configure the template directory\nTEMPLATES = [\n    {\n        'BACKEND': 'django.template.backends.django.DjangoTemplates',\n        'DIRS': [BASE_DIR / 'templates'],  # Your custom templates folder\n        'APP_DIRS': True,\n        'OPTIONS': {\n            'context_processors': [\n                'django.template.context_processors.debug',\n                'django.template.context_processors.request',\n                'django.contrib.auth.context_processors.auth',\n                'django.contrib.messages.context_processors.messages',\n            ],\n        },\n    },\n]\n\n# Step 5: Configure the static directory\nSTATIC_URL = '/static/'\nSTATICFILES_DIRS = [\n    BASE_DIR / 'myapp' / 'static',\n]\n# (The manual also shows BASE_DIR / 'static' - use that only if you\n#  make a \"static\" folder next to manage.py.)\n"}, "week04-django-basics/website/website/urls.py": {"kind": "text", "text": "# website/urls.py  (project-level urls.py)\nfrom django.contrib import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', include('myapp.urls')),\n]\n"}, "week03-shopping-cart-ui/login.html": {"kind": "text", "text": "<!-- NOT IN THE MANUAL: index.html links to login.html, but the manual does not give this page.\n     This is a simple page in the same Bootstrap style, using Flexbox to centre the form. -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Login - Shopping Cart<\/title>\n  <link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css\" crossorigin=\"anonymous\">\n  <style>\n    body { padding-top: 0; background: #f4f7f8; }\n    .page { min-height: 80vh; display: flex; justify-content: center; align-items: center; }\n    .auth-card { width: 100%; max-width: 400px; }\n  <\/style>\n<\/head>\n<body>\n  <nav class=\"navbar navbar-dark bg-dark\">\n    <a class=\"navbar-brand\" href=\"index.html\">Shopping Cart<\/a>\n  <\/nav>\n\n  <div class=\"page\">\n    <div class=\"card auth-card p-4\">\n      <h3 class=\"text-center mb-3\">Login<\/h3>\n      <form id=\"loginForm\">\n        <div class=\"form-group\">\n          <label for=\"username\">User Name<\/label>\n          <input type=\"text\" class=\"form-control\" id=\"username\" required>\n        <\/div>\n        <div class=\"form-group\">\n          <label for=\"password\">Password<\/label>\n          <input type=\"password\" class=\"form-control\" id=\"password\" required>\n        <\/div>\n        <button type=\"submit\" class=\"btn btn-primary btn-block\">Login<\/button>\n      <\/form>\n      <p class=\"text-center mt-3 mb-0\">New user? <a href=\"registration.html\">Register here<\/a><\/p>\n    <\/div>\n  <\/div>\n\n  <script>\n    document.getElementById(\"loginForm\").addEventListener(\"submit\", function (event) {\n      event.preventDefault();\n      alert(\"Login successful!\");\n      window.location.href = \"index.html\";\n    });\n  <\/script>\n<\/body>\n<\/html>\n"}, "week03-shopping-cart-ui/README.md": {"kind": "text", "text": "# Week 3 — Responsive Shopping Cart (CSS3, Flex & Grid)\n\n**Aim:** Build a responsive web application for a shopping cart with Registration, Login, Catalog and Cart pages using CSS3 features, Flex and Grid.\n\n## Steps\n\n1. **Create the folder layout:**\n\n   ```text\n   week3/\n   ├── index.html\n   ├── login.html\n   ├── registration.html\n   ├── assets/css/style.css\n   └── images/      dress1.jfif, item-2.jpeg, dress3.jfif, cart.jfif, cart-icon.png\n   ```\n\n   Put any three product photos and a cart icon in `images/` with those names.\n2. **Write the catalog page** [index.html](open:week03-shopping-cart-ui/index.html). It loads Bootstrap 4 from a CDN and has:\n   - a dark header and a collapsible navbar (Catalog, Login, Register, Cart)\n   - a Bootstrap grid row with three product cards: `col-sm-12 col-md-6 col-xl-4` gives 1, 2 or 3 cards per row depending on screen width\n   - each *Add to Cart* button carries `data-name` and `data-price`\n3. **Add the cart modal.** The `#cartModal` dialog lists the items in `#cartItems` and the total in `#cartTotal`.\n4. **Add the script** at the end of `index.html`:\n   - clicking *Add to Cart* pushes `{name, price}` into the `cart` array, calls `updateCart()` and opens the modal\n   - `updateCart()` rebuilds the list and the total with `toFixed(2)`\n   - *Checkout* shows the order summary, empties the cart and closes the modal\n5. **Write the stylesheet** [assets/css/style.css](open:week03-shopping-cart-ui/assets/css/style.css): card image wrap, rating labels, the cart badge, the `.zoom:hover { transform: scale(1.05) }` effect and the toast keyframe animations.\n6. **Add the Login and Registration pages** [login.html](open:week03-shopping-cart-ui/login.html) and [registration.html](open:week03-shopping-cart-ui/registration.html). The navbar links to them, but the manual does not print them; these versions centre the card with Flexbox and use CSS Grid for two-column fields.\n7. **Test it.** Open `index.html`, add items, open the cart and check out. Compare with [catalog](open:week03-shopping-cart-ui/output/catalog.jpg), [cart](open:week03-shopping-cart-ui/output/cart-modal.jpg) and [checkout summary](open:week03-shopping-cart-ui/output/checkout-summary.jpg).\n"}, "week03-shopping-cart-ui/index.html": {"kind": "text", "text": "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Shopping Cart<\/title>\n  <link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css\" crossorigin=\"anonymous\">\n  <link rel=\"stylesheet\" href=\"assets/css/style.css\">\n  <link rel=\"icon\" type=\"image/png\" href=\"images/cart-icon.png\">\n<\/head>\n\n<body>\n  <header class=\"bg-dark text-white text-center py-3\">\n    <h1>Shopping Cart<\/h1>\n  <\/header>\n\n  <!-- Navbar -->\n  <nav class=\"navbar navbar-expand-lg navbar-dark bg-dark\">\n    <a class=\"navbar-brand\" href=\"#\">Home<\/a>\n    <button class=\"navbar-toggler\" type=\"button\" data-toggle=\"collapse\" data-target=\"#navbarNav\">\n      <span class=\"navbar-toggler-icon\"><\/span>\n    <\/button>\n\n    <div class=\"collapse navbar-collapse\" id=\"navbarNav\">\n      <ul class=\"navbar-nav ml-auto\">\n        <!-- Catalog -->\n        <li class=\"nav-item\">\n          <a class=\"nav-link\" href=\"#catalog\">Catalog<\/a>\n        <\/li>\n        <!-- Login -->\n        <li class=\"nav-item\">\n          <a class=\"nav-link\" href=\"login.html\">Login<\/a>\n        <\/li>\n        <!-- Registration -->\n        <li class=\"nav-item\">\n          <a class=\"nav-link\" href=\"registration.html\">Register<\/a>\n        <\/li>\n        <!-- Cart -->\n        <li class=\"nav-item\">\n          <a class=\"nav-link\" href=\"#\" data-toggle=\"modal\" data-target=\"#cartModal\">\n            <img src=\"images/cart.jfif\" alt=\"Cart\" class=\"cart-icon\"> Cart\n          <\/a>\n        <\/li>\n      <\/ul>\n    <\/div>\n  <\/nav>\n\n  <!-- Main -->\n  <div class=\"container\">\n\n    <br>\n\n    <h3 class=\"text-center\">Shopping Cart<\/h3>\n    <hr>\n\n    <div class=\"row\">\n      <div class=\"col-sm-12 col-md-6 col-xl-4\">\n        <figure class=\"card card-product zoom\">\n          <div class=\"img-wrap\"><img src=\"images/dress1.jfif\" class=\"rounded p-1\"><\/div>\n          <figcaption class=\"info-wrap\">\n            <h4 class=\"title\">Beautiful dress<\/h4>\n            <p class=\"desc\">\"Adorn yourself in the allure of timeless beauty with our collection, where\n              each dress is a masterpiece of grace and charm.\"<\/p>\n            <div class=\"rating-wrap\">\n              <div class=\"label-rating\">132 reviews<\/div>\n              <div class=\"label-rating\">154 orders <\/div>\n              <br />\n              <small class=\"text-muted\">&#9733; &#9733; &#9733; &#9733; &#9734;<\/small>\n            <\/div> <!-- rating-wrap.// -->\n          <\/figcaption>\n          <div class=\"bottom-wrap\">\n            <button class=\"btn btn-primary add-to-cart\" data-name=\"Beautiful Dress\" data-price=\"220\">Add to Cart<\/button>\n\n            <div class=\"price-wrap h5\">\n              <span class=\"price-new\">$220<\/span> <del class=\"price-old\">$180<\/del>\n            <\/div> <!-- price-wrap.// -->\n          <\/div> <!-- bottom-wrap.// -->\n        <\/figure>\n      <\/div>\n      <!-- col // -->\n\n      <div class=\"col-sm-12 col-md-6 col-xl-4\">\n        <figure class=\"card card-product zoom\">\n          <div class=\"img-wrap\"><img src=\"images/item-2.jpeg\" class=\"rounded p-1\"><\/div>\n          <figcaption class=\"info-wrap\">\n            <h4 class=\"title\">Elegant style<\/h4>\n            <p class=\"desc\">\"Elevate your wardrobe with an essence through our collection, where\n              elegance becomes a signature style.\"<\/p>\n            <div class=\"rating-wrap\">\n              <div class=\"label-rating\">122 reviews<\/div>\n              <div class=\"label-rating\">120 orders <\/div>\n              <br />\n              <small class=\"text-muted\">&#9733; &#9733; &#9733; &#9733; &#9734;<\/small>\n            <\/div> <!-- rating-wrap.// -->\n          <\/figcaption>\n          <div class=\"bottom-wrap\">\n            <button class=\"btn btn-primary add-to-cart\" data-name=\"Elegant Style\" data-price=\"115\">Add to Cart<\/button>\n\n            <div class=\"price-wrap h5\">\n              <span class=\"price-new\">$115<\/span> <del class=\"price-old\">$180<\/del>\n            <\/div> <!-- price-wrap.// -->\n          <\/div> <!-- bottom-wrap.// -->\n        <\/figure>\n      <\/div>\n      <!-- col // -->\n\n      <div class=\"col-sm-12 col-md-6 col-xl-4\">\n        <figure class=\"card card-product zoom\">\n          <div class=\"img-wrap\"><img src=\"images/dress3.jfif\" class=\"rounded p-1\"><\/div>\n          <figcaption class=\"info-wrap\">\n            <h4 class=\"title\">Modern fashion<\/h4>\n            <p class=\"desc\">\"Discover the epitome of modern fashion, where style meets innovation in\n              every stitch and silhouette.\"<\/p>\n            <div class=\"rating-wrap\">\n              <div class=\"label-rating\">138 reviews<\/div>\n              <div class=\"label-rating\">159 orders<\/div>\n              <br />\n              <small class=\"text-muted\">&#9733; &#9733; &#9733; &#9733; &#9734;<\/small>\n            <\/div> <!-- rating-wrap.// -->\n          <\/figcaption>\n          <div class=\"bottom-wrap\">\n            <button class=\"btn btn-primary add-to-cart\" data-name=\"Modern Fashion\" data-price=\"680\">Add to Cart<\/button>\n\n            <div class=\"price-wrap h5\">\n              <span class=\"price-new\">$680<\/span> <del class=\"price-old\">$980<\/del>\n            <\/div> <!-- price-wrap.// -->\n          <\/div> <!-- bottom-wrap.// -->\n        <\/figure>\n      <\/div> <!-- col // -->\n    <\/div> <!-- row.// -->\n  <\/div> <!-- container.// -->\n\n  <!-- Cart Modal -->\n  <div class=\"modal fade\" id=\"cartModal\" tabindex=\"-1\" role=\"dialog\">\n    <div class=\"modal-dialog\" role=\"document\">\n      <div class=\"modal-content\">\n        <div class=\"modal-header\">\n          <h5 class=\"modal-title\">Your Cart<\/h5>\n          <button type=\"button\" class=\"close\" data-dismiss=\"modal\">&times;<\/button>\n        <\/div>\n        <div class=\"modal-body\">\n          <ul id=\"cartItems\" class=\"list-group\"><\/ul>\n          <p class=\"mt-3 font-weight-bold\">Total: $<span id=\"cartTotal\">0<\/span><\/p>\n        <\/div>\n        <div class=\"modal-footer\">\n          <button class=\"btn btn-secondary\" data-dismiss=\"modal\">Close<\/button>\n          <button class=\"btn btn-success\">Checkout<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <script src=\"https://code.jquery.com/jquery-3.2.1.slim.min.js\"><\/script>\n  <script src=\"https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js\"><\/script>\n\n  <script>\n    let cart = [];\n    document.querySelectorAll('.add-to-cart').forEach(btn => {\n      btn.addEventListener('click', () => {\n        const name = btn.dataset.name;\n        const price = parseFloat(btn.dataset.price);\n        cart.push({name, price});\n        updateCart();\n        $('#cartModal').modal('show');\n      });\n    });\n\n    function updateCart() {\n      const cartItems = document.getElementById('cartItems');\n      cartItems.innerHTML = '';\n      let total = 0;\n      cart.forEach(item => {\n        const li = document.createElement('li');\n        li.className = 'list-group-item';\n        li.textContent = `${item.name} - $${item.price}`;\n        cartItems.appendChild(li);\n        total += item.price;\n      });\n      document.getElementById('cartTotal').textContent = total.toFixed(2);\n    }\n\n    // Checkout function\n    document.querySelector('.btn-success').addEventListener('click', () => {\n      if (cart.length === 0) {\n        alert(\"Your cart is empty!\");\n        return;\n      }\n\n      let summary = \"Order Summary:\\n\";\n      cart.forEach(item => {\n        summary += `${item.name} - $${item.price}\\n`;\n      });\n      summary += `\\nTotal: $${document.getElementById('cartTotal').textContent}`;\n\n      alert(summary);                // Show order summary\n      cart = [];                     // Clear cart after checkout\n      updateCart();                  // Refresh cart display\n      $('#cartModal').modal('hide'); // Close modal\n    });\n  <\/script>\n<\/body>\n\n<\/html>\n"}, "week03-shopping-cart-ui/registration.html": {"kind": "text", "text": "<!-- NOT IN THE MANUAL: index.html links to registration.html, but the manual does not give this page.\n     This is a simple page in the same Bootstrap style, using CSS Grid for the two-column fields. -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Register - Shopping Cart<\/title>\n  <link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css\" crossorigin=\"anonymous\">\n  <style>\n    body { background: #f4f7f8; }\n    .page { min-height: 80vh; display: flex; justify-content: center; align-items: center; padding: 20px; }\n    .auth-card { width: 100%; max-width: 560px; }\n    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }\n    @media (max-width: 576px) {\n      .grid-2 { grid-template-columns: 1fr; }\n    }\n  <\/style>\n<\/head>\n<body>\n  <nav class=\"navbar navbar-dark bg-dark\">\n    <a class=\"navbar-brand\" href=\"index.html\">Shopping Cart<\/a>\n  <\/nav>\n\n  <div class=\"page\">\n    <div class=\"card auth-card p-4\">\n      <h3 class=\"text-center mb-3\">Create an Account<\/h3>\n      <form id=\"registerForm\">\n        <div class=\"grid-2\">\n          <div class=\"form-group\">\n            <label for=\"username\">User Name<\/label>\n            <input type=\"text\" class=\"form-control\" id=\"username\" required>\n          <\/div>\n          <div class=\"form-group\">\n            <label for=\"email\">Mail-id<\/label>\n            <input type=\"email\" class=\"form-control\" id=\"email\" required>\n          <\/div>\n          <div class=\"form-group\">\n            <label for=\"password\">Password<\/label>\n            <input type=\"password\" class=\"form-control\" id=\"password\" required>\n          <\/div>\n          <div class=\"form-group\">\n            <label for=\"contact\">Contact Number<\/label>\n            <input type=\"tel\" class=\"form-control\" id=\"contact\" pattern=\"[0-9]{10}\" placeholder=\"10-digit number\" required>\n          <\/div>\n        <\/div>\n        <div class=\"form-group\">\n          <label for=\"address\">Address<\/label>\n          <textarea class=\"form-control\" id=\"address\" rows=\"2\" required><\/textarea>\n        <\/div>\n        <button type=\"submit\" class=\"btn btn-primary btn-block\">Register<\/button>\n      <\/form>\n      <p class=\"text-center mt-3 mb-0\">Already have an account? <a href=\"login.html\">Login here<\/a><\/p>\n    <\/div>\n  <\/div>\n\n  <script>\n    document.getElementById(\"registerForm\").addEventListener(\"submit\", function (event) {\n      event.preventDefault();\n      alert(\"Registration successful!\");\n      window.location.href = \"login.html\";\n    });\n  <\/script>\n<\/body>\n<\/html>\n"}, "week03-shopping-cart-ui/assets/css/style.css": {"kind": "text", "text": "body {\n  padding-top: 80px;\n}\n\n/* product cart design */\n.show-cart li {\n  display: flex;\n}\n\n.cart-container {\n  position: relative;\n  display: inline-block;\n}\n\n.cart-icon {\n  width: 30px; /* Adjust the width and height according to your icon size */\n  height: 30px;\n  cursor: pointer;\n}\n\n/* Add a hover effect if desired */\n.cart-container:hover .cart-icon {\n  filter: brightness(1.2); /* Adjust the brightness for the hover effect */\n}\n\n.card {\n  margin-bottom: 20px;\n}\n\n.card-img-top {\n  width: 200px;\n  height: 200px;\n  align-self: center;\n}\n\n.card-product .img-wrap {\n  border-radius: 3px 3px 0 0;\n  overflow: hidden;\n  position: relative;\n  height: 220px;\n  text-align: center;\n}\n\n.card-product .img-wrap img {\n  max-height: 100%;\n  max-width: 100%;\n  object-fit: cover;\n}\n\n.card-product .info-wrap {\n  overflow: hidden;\n  padding: 15px;\n  border-top: 1px solid #eee;\n}\n\n.card-product .bottom-wrap {\n  padding: 15px;\n  border-top: 1px solid #eee;\n}\n\n.label-rating {\n  margin-right: 10px;\n  color: #333;\n  display: inline-block;\n  vertical-align: middle;\n}\n\n.card-product .price-old {\n  color: #999;\n}\n\n/* shopping cart counter */\n.header { background: rgb(0, 178, 255); color: #fff; }\n\n#lblCartCount {\n  font-size: 12px;\n  background: #ff0000;\n  color: #fff;\n  padding: 0 5px;\n  vertical-align: top;\n  margin-left: -10px;\n}\n\n.badge {\n  padding-right: 9px;\n  -webkit-border-radius: 9px;\n  -moz-border-radius: 9px;\n  border-radius: 9px;\n}\n\n.label-warning[href],\n.badge-warning[href] {\n  background-color: #c67605;\n}\n\n/* shopping cart counter style */\ni.fa-shopping-cart {\n  width: 2.2em;\n  text-align: center;\n  vertical-align: middle;\n}\n\n.fa-shopping-cart {\n  margin-top: 0.2em;\n  position: relative;\n}\n\n.badge {\n  font-size: .25em;\n  display: block;\n  position: absolute;\n  top: -.70em;\n  right: -.70em;\n  width: 2.5em;\n  height: 2.4em;\n  line-height: 2em;\n  border-radius: 50%;\n  text-align: center;\n  color: #fff;\n  background: rgba(207, 0, 15, 1);\n}\n\n/* product zoom on hover */\n.zoom, .zoom-sm {\n  transition: transform .2s;\n}\n\n.zoom:hover {\n  transform: scale(1.05);\n}\n\n.zoom-sm:hover {\n  transform: scale(1.03);\n}\n\n/* shopping cart toast */\n#product-toast {\n  visibility: hidden;\n  max-width: 50px;\n  height: 50px;\n  margin: auto;\n  background-color: #333;\n  color: #fff;\n  text-align: center;\n  border-radius: 2px;\n  position: fixed;\n  z-index: 1;\n  left: 0; right: 0;\n  bottom: 30px;\n  font-size: 17px;\n  white-space: nowrap;\n}\n\n#product-toast #img {\n  width: 70px;\n  height: 50px;\n  float: left;\n  padding-top: 16px;\n  padding-bottom: 16px;\n  box-sizing: border-box;\n  background-color: #111;\n  color: #fff;\n  padding: 16px;\n  overflow: hidden;\n  white-space: nowrap;\n}\n\n#product-toast.show {\n  visibility: visible;\n  -webkit-animation: fadein 0.5s, expand 0.5s 0.5s, stay 3s 1s, shrink 0.5s 2s, fadeout 0.5s 2.5s;\n  animation: fadein 0.5s, expand 0.5s 0.5s, stay 3s 1s, shrink 0.5s 4s, fadeout 0.5s 4.5s;\n}\n\n@keyframes fadein {\n  from {bottom: 0; opacity: 0;}\n  to {bottom: 30px; opacity: 1;}\n}\n\n@-webkit-keyframes expand {\n  from {min-width: 50px}\n  to {min-width: 350px}\n}\n\n@keyframes expand {\n  from {min-width: 50px}\n  to {min-width: 350px}\n}\n\n@-webkit-keyframes stay {\n  from {min-width: 350px}\n  to {min-width: 350px}\n}\n\n@keyframes stay {\n  from {min-width: 350px}\n  to {min-width: 350px}\n}\n\n@-webkit-keyframes shrink {\n  from {min-width: 350px;}\n  to {min-width: 50px;}\n}\n\n@keyframes shrink {\n  from {min-width: 350px;}\n  to {min-width: 50px;}\n}\n\n@-webkit-keyframes fadeout {\n  from {bottom: 30px; opacity: 1;}\n  to {bottom: 60px; opacity: 0;}\n}\n\n@keyframes fadeout {\n  from {bottom: 30px; opacity: 1;}\n  to {bottom: 60px; opacity: 0;}\n}\n"}, "week01-registration-form/output/static-form.jpg": {"kind": "image", "src": "img/w1-static-form.jpg", "caption": "Static form, no CSS"}, "week01-registration-form/output/responsive-form.jpg": {"kind": "image", "src": "img/w1-responsive-form.jpg", "caption": "Responsive form with CSS"}, "week02-regex-validation/output/form.jpg": {"kind": "image", "src": "img/w2-form.jpg", "caption": "Form before validation"}, "week02-regex-validation/output/invalid-username-aler <script>
(() => {
const DATA = JSON.parse(document.getElementById('lab-data').textContent);
const FILES = DATA.files;            // path -> {kind, text|src, caption}
const WEEKS = DATA.weeks;            // array of week meta
const PATHS = Object.keys(FILES);
const weekByDir = Object.fromEntries(WEEKS.map(w => [w.dir, w]));
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- file types ---------- */
const base = p => p.split('/').pop();
const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const weekOf = p => weekByDir[p.split('/')[0]] || null;
function ext(p){ const b = base(p); if (b === '.env') return 'env'; if (b === '.gitignore') return 'gitignore'; const i = b.lastIndexOf('.'); return i > 0 ? b.slice(i+1).toLowerCase() : ''; }
function langOf(p){
  const e = ext(p), f = FILES[p];
  if (e === 'html') return /\{%|\{\{/.test(f.text || '') ? ['django','Django HTML'] : ['xml','HTML'];
  return ({py:['python','Python'], css:['css','CSS'], js:['javascript','JavaScript'], md:['markdown','Markdown'],
    txt:['plaintext','Plain Text'], env:['ini','Properties'], gitignore:['bash','Ignore'], jpg:['','Image']})[e] || ['plaintext','Plain Text'];
}
const ICONS = {
  html:['&lt;&gt;','#e37933'], py:['py','#3b8eea'], css:['#','#519aba'], js:['JS','#cbcb41'], txt:['≡','#6d8086'],
  env:['⚙','#6d8086'], gitignore:['◆','#6d8086'], jpg:['▣','#a074c4'], md:['M↓','#519aba']
};
function ficon(p){
  if (base(p) === 'README.md') return `<span class="ficon" style="color:#519aba">ⓘ</span>`;
  const [g, c] = ICONS[ext(p)] || ['·','#6d8086'];
  return `<span class="ficon" style="color:${c}">${g}</span>`;
}
const chevron = '<svg class="codicon" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4"/></svg>';
const SEV_ICON = {
  error:'<svg class="codicon sev error" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="m5.8 5.8 4.4 4.4M10.2 5.8l-4.4 4.4"/></svg>',
  warning:'<svg class="codicon sev warning" viewBox="0 0 16 16"><path d="M8 2 14.5 13.5h-13z"/><path d="M8 6.5v3.2M8 11.6v.1"/></svg>',
  info:'<svg class="codicon sev info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7.3v4M8 4.9v.1"/></svg>'
};

/* ---------- tree ---------- */
function buildTree(){
  const root = {name:'', path:'', dirs:{}, files:[]};
  for (const p of PATHS){
    const parts = p.split('/'); let node = root;
    for (let i = 0; i < parts.length - 1; i++){
      const seg = parts[i];
      node.dirs[seg] ||= {name:seg, path:parts.slice(0,i+1).join('/'), dirs:{}, files:[]};
      node = node.dirs[seg];
    }
    node.files.push(p);
  }
  return root;
}
const TREE = buildTree();
const expanded = new Set();
let rootOpen = true;
const cmp = (a,b) => a.toLowerCase().localeCompare(b.toLowerCase(), undefined, {numeric:true});
function problemCounts(dirPath){
  const w = weekByDir[dirPath]; if (!w) return null;
  const e = w.problems.filter(p => p.sev === 'error').length, wa = w.problems.filter(p => p.sev === 'warning').length;
  return {e, wa};
}
function renderTree(){
  const out = [];
  const walk = (node, depth) => {
    for (const d of Object.values(node.dirs).sort((a,b) => cmp(a.name,b.name))){
      const open = expanded.has(d.path);
      let badge = '';
      if (depth === 0){ const c = problemCounts(d.path); if (c && (c.e || c.wa)) badge = `<span class="badge-count ${c.e?'err':'warn'}" title="${c.e} errors, ${c.wa} warnings fixed vs. the printed manual">${c.e + c.wa}</span>`; }
      out.push(row(d.path, depth, `<span class="twisty ${open?'open':''}">${chevron}</span><span class="name">${esc(d.name)}</span>${badge}`, 'dir', open));
      if (open) walk(d, depth + 1);
    }
    for (const f of node.files.sort((a,b) => cmp(base(a), base(b)))){
      out.push(row(f, depth, `<span class="twisty none"></span>${ficon(f)}<span class="name">${esc(base(f))}</span>`, 'file'));
    }
  };
  if (rootOpen) walk(TREE, 0);
  $('#tree').innerHTML = out.join('');
  $('#rootHead .codicon').style.transform = rootOpen ? 'rotate(90deg)' : '';
  markSelected();
}
function row(path, depth, inner, kind, open){
  let guides = '';
  for (let i = 0; i < depth; i++) guides += `<span class="guide" style="left:${16 + i*8}px"></span>`;
  const aria = kind === 'dir' ? `aria-expanded="${open}"` : '';
  return `<div class="row" role="treeitem" tabindex="-1" ${aria} data-kind="${kind}" data-path="${esc(path)}" style="padding-left:${8 + depth*8}px" title="${esc(path)}">${guides}${inner}</div>`;
}
function markSelected(){
  document.querySelectorAll('#tree .row').forEach(r => r.classList.toggle('selected', r.dataset.path === active));
}
function reveal(path){
  const parts = path.split('/');
  for (let i = 1; i < parts.length; i++) expanded.add(parts.slice(0,i).join('/'));

/* ---------- tabs & editor ---------- */
let tabs = [];        // {path, preview}
let active = null;
function openFile(path, opts = {}){
  if (!FILES[path]) return;
  const existing = tabs.find(t => t.path === path);
  if (!existing){
    const prevIdx = tabs.findIndex(t => t.preview);
    const t = {path, preview: !!opts.preview};
    if (opts.preview && prevIdx >= 0) tabs[prevIdx] = t;
    else { const ai = tabs.findIndex(t => t.path === active); tabs.splice(ai >= 0 ? ai + 1 : tabs.length, 0, t); }
  } else if (!opts.preview) existing.preview = false;
  active = path;
  renderTabs(); renderEditor(opts.line); updateChrome();
  if (!opts.noReveal) reveal(path); else markSelected();
  store.set('lab:last', path);
  const w = weekOf(path); const h = w ? `week-${w.n}` : '';
  if (location.hash.slice(1) !== h && base(path) === 'README.md') history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
}
function pin(path){ const t = tabs.find(t => t.path === path); if (t){ t.preview = false; renderTabs(); } }
function closeTab(path){
  const i = tabs.findIndex(t => t.path === path); if (i < 0) return;
  tabs.splice(i, 1);
  if (active === path){ const n = tabs[i] || tabs[i-1]; active = n ? n.path : null; }
  renderTabs(); renderEditor(); updateChrome(); markSelected();
}
function renderTabs(){
  $('#tabs').innerHTML = tabs.map(t => {
    const w = weekOf(t.path); const name = base(t.path);
    const label = name === 'README.md' && w ? `README.md <span style="opacity:.6">· Week ${w.n}</span>` : esc(name);
    return `<div class="tab ${t.path===active?'active':''} ${t.preview?'preview':''}" role="tab" aria-selected="${t.path===active}" tabindex="0" data-path="${esc(t.path)}" title="${esc(t.path)}">
      ${ficon(t.path)}<span class="tname">${label}</span>
      <button class="close" aria-label="Close ${esc(name)}" data-close="${esc(t.path)}"><svg class="codicon" viewBox="0 0 16 16"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/></svg></button></div>`;
  }).join('');

}
$('#tabs').addEventListener('click', e => {

const mdSource = new Set();   // markdown files shown as source instead of preview

function renderMarkdown(el, text){

function runSearch(){
  const q = $('#searchInput').value.trim(); const res = $('#searchResults');
  if (q.length < 2){ res.innerHTML = ''; $('#searchMeta').textContent = "Search every week's code and steps."; return; }
  const ql = q.toLowerCase(); let total = 0, files = 0; const out = [];
  for (const p of PATHS.sort(cmp)){
    const f = FILES[p]; if (f.kind !== 'text') continue;
    const hits = [];
    f.text.split('\n').forEach((ln, i) => { const k = ln.toLowerCase().indexOf(ql); if (k >= 0) hits.push([i+1, ln, k]); });
    const nameHit = base(p).toLowerCase().includes(ql);
    if (!hits.length && !nameHit) continue;
    files++; total += hits.length;
    out.push(`<div class="sr-file" data-open="${esc(p)}">${ficon(p)}<span>${esc(base(p))}</span><span class="dir">${esc(dirOf(p))}</span></div>` +
      hits.slice(0, 30).map(([n, ln, k]) => { const s = Math.max(0, k - 24); const pre = (s ? '…' : '') + ln.slice(s, k).trimStart();
        return `<div class="sr-line" data-open="${esc(p)}" data-line="${n}" title="Line ${n}"><span>${esc(pre)}<mark>${esc(ln.slice(k, k + q.length))}</mark>${esc(ln.slice(k + q.length, k + q.length + 80))}</span></div>`; }).join(''));
  }
  $('#searchMeta').textContent = files ? `${total} result${total===1?'':'s'} in ${files} file${files===1?'':'s'}` : `No results for “${q}”. Try a file name or a word like csrf_token.`;
  res.innerHTML = out.join('');
}

/* ---------- quick open ---------- */
let qoSel = 0, qoItems = [];
function openQO(){ $('#qo').hidden = false; $('#qoInput').value = ''; renderQO(); $('#qoInput').focus(); }
function closeQO(){ $('#qo').hidden = true; }
function score(p, q){
  if (!q) return 1;
  const w = weekOf(p); const hay = (p + (w ? ` week ${w.n} ` + w.title : '')).toLowerCase();
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean); let s = 0;
  for (const t of terms){ const i = hay.indexOf(t); if (i < 0) return 0; s += base(p).toLowerCase().includes(t) ? 10 : 2; }
  return s;
}
function renderQO(){
  const q = $('#qoInput').value.trim();
  qoItems = PATHS.map(p => [p, score(p, q)]).filter(x => x[1] > 0).sort((a,b) => b[1]-a[1] || cmp(a[0],b[0])).slice(0, 60).map(x => x[0]);
  qoSel = 0;
  $('#qoList').innerHTML = qoItems.length ? qoItems.map((p,i) => `<div class="qo-item ${i===0?'on':''}" role="option" data-i="${i}">${ficon(p)}<span>${esc(base(p))}</span><span class="dir">${esc(dirOf(p))}</span></div>`).join('')
    : `<div class="qo-item">No matching files</div>`;
}
function moveQO(d){ if (!qoItems.length) return; qoSel = (qoSel + d + qoItems.length) % qoItems.length;
  document.querySelectorAll('.qo-item').forEach((el,i) => el.classList.toggle('on', i === qoSel));
  document.querySelector('.qo-item.on')?.scrollIntoView({block:'nearest'}); }
$('#qoInput').addEventListener('input', renderQO);

  else if (e.key === 'Enter'){ e.preventDefault(); if (qoItems[qoSel]){ openFile(qoItems[qoSel]); closeQO(); } }
  else if (e.key === 'Escape') closeQO();
});

function copy(text, msg){
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(e){} ta.remove(); toast(ok ? msg : 'Select the text and press Ctrl+C to copy'); };
  try { navigator.clipboard.writeText(text).then(() => toast(msg), fallback); } catch(e){ fallback(); }

/* ---------- boot ---------- */
if (store.get('lab:side') === '0' && !matchMedia('(max-width:760px)').matches) setSide(false);
if (store.get('lab:panel') === '0' || (store.get('lab:panel') === null && matchMedia('(max-width:760px)').matches)) setPanel(false);
function routeFromHash(){
  const m = location.hash.match(/^#week-(\d+)$/);
  if (m){ const w = WEEKS.find(x => x.n === +m[1]); if (w){ openFile(w.dir + '/README.md'); return true; } }
  return false;
}
window.addEventListener('hashchange', routeFromHash);
const startHash = location.hash;
openFile('README.md');
if (startHash && history.replaceState) history.replaceState(null, '', startHash);
if (!routeFromHash()){ const last = store.get('lab:last'); if (last && FILES[last] && last !== 'README.md') openFile(last); }
})();
</script>
