<title>Django Lab R25</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: VS Code workbench — title bar, activity bar, explorer, editor with tabs, bottom panel, status bar. Dark+ by default, Light+ for light viewers. */
:root{
  color-scheme: light;
  --ui: -apple-system, "Segoe UI", system-ui, Ubuntu, "Droid Sans", sans-serif;
  --mono: Consolas, "Cascadia Mono", Menlo, "JetBrains Mono", "Courier New", monospace;
  --title-bg:#dddddd; --title-fg:#333333; --cc-bg:#ececec; --cc-border:#c9c9c9;
  --act-bg:#2c2c2c; --act-fg:#ffffff; --act-dim:#ffffff99; --act-border:#2c2c2c;
  --side-bg:#f3f3f3; --side-fg:#616161; --side-head:#6f6f6f;
  --ed-bg:#ffffff; --ed-fg:#000000; --gutter:#237893; --gutter-active:#0b216f; --line-hl:#eeeeee;
  --tab-bg:#ececec; --tab-fg:#333333b3; --tab-active-bg:#ffffff; --tab-active-fg:#333333; --tab-border:#f3f3f3; --tabs-bg:#f3f3f3;
  --hover:#e8e8e8; --sel:#0060c0; --sel-fg:#ffffff; --sel-inactive:#e4e6f1; --focus:#0090f1;
  --panel-bg:#ffffff; --panel-border:#e5e5e5; --muted:#717171;
  --status-bg:#007acc; --status-fg:#ffffff; --status-hover:#ffffff1f;
  --input-bg:#ffffff; --input-border:#cecece; --widget-bg:#f3f3f3; --widget-shadow:0 0 8px #00000029;
  --badge-bg:#c4c4c4; --badge-fg:#333;
  --err:#e51400; --warn:#bf8803; --info:#1a85ff;
  --md-code-bg:#f3f3f3; --md-border:#d0d7de; --link:#006ab1; --guide:#d3d3d3;
  --term-prompt:#0e7a0d; --term-fg:#333333;
  --t-kw:#0000ff; --t-ctrl:#af00db; --t-str:#a31515; --t-com:#008000; --t-fn:#795e26; --t-type:#267f99; --t-var:#001080; --t-num:#098658; --t-tag:#800000; --t-attr:#e50000; --t-punc:#000000; --t-meta:#0000ff; --t-regex:#811f3f; --t-tmpl:#0000ff;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --title-bg:#3c3c3c; --title-fg:#cccccc; --cc-bg:#ffffff12; --cc-border:#ffffff1f;
  --act-bg:#333333; --act-fg:#ffffff; --act-dim:#ffffff66; --act-border:#333333;
  --side-bg:#252526; --side-fg:#cccccc; --side-head:#bbbbbb;
  --ed-bg:#1e1e1e; --ed-fg:#d4d4d4; --gutter:#858585; --gutter-active:#c6c6c6; --line-hl:#ffffff0f;
  --tab-bg:#2d2d2d; --tab-fg:#ffffff80; --tab-active-bg:#1e1e1e; --tab-active-fg:#ffffff; --tab-border:#252526; --tabs-bg:#252526;
  --hover:#2a2d2e; --sel:#04395e; --sel-fg:#ffffff; --sel-inactive:#37373d; --focus:#007fd4;
  --panel-bg:#1e1e1e; --panel-border:#80808059; --muted:#9d9d9d;
  --status-bg:#007acc; --status-fg:#ffffff; --status-hover:#ffffff1f;
  --input-bg:#3c3c3c; --input-border:#3c3c3c; --widget-bg:#252526; --widget-shadow:0 0 8px #000000a8;
  --badge-bg:#4d4d4d; --badge-fg:#fff;
  --err:#f14c4c; --warn:#cca700; --info:#3794ff;
  --md-code-bg:#ffffff12; --md-border:#ffffff21; --link:#3794ff; --guide:#585858;
  --term-prompt:#23d18b; --term-fg:#cccccc;
  --t-kw:#569cd6; --t-ctrl:#c586c0; --t-str:#ce9178; --t-com:#6a9955; --t-fn:#dcdcaa; --t-type:#4ec9b0; --t-var:#9cdcfe; --t-num:#b5cea8; --t-tag:#569cd6; --t-attr:#9cdcfe; --t-punc:#808080; --t-meta:#569cd6; --t-regex:#d16969; --t-tmpl:#c586c0;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --title-bg:#3c3c3c; --title-fg:#cccccc; --cc-bg:#ffffff12; --cc-border:#ffffff1f;
  --act-bg:#333333; --act-fg:#ffffff; --act-dim:#ffffff66; --act-border:#333333;
  --side-bg:#252526; --side-fg:#cccccc; --side-head:#bbbbbb;
  --ed-bg:#1e1e1e; --ed-fg:#d4d4d4; --gutter:#858585; --gutter-active:#c6c6c6; --line-hl:#ffffff0f;
  --tab-bg:#2d2d2d; --tab-fg:#ffffff80; --tab-active-bg:#1e1e1e; --tab-active-fg:#ffffff; --tab-border:#252526; --tabs-bg:#252526;
  --hover:#2a2d2e; --sel:#04395e; --sel-fg:#ffffff; --sel-inactive:#37373d; --focus:#007fd4;
  --panel-bg:#1e1e1e; --panel-border:#80808059; --muted:#9d9d9d;
  --status-bg:#007acc; --status-fg:#ffffff; --status-hover:#ffffff1f;
  --input-bg:#3c3c3c; --input-border:#3c3c3c; --widget-bg:#252526; --widget-shadow:0 0 8px #000000a8;
  --badge-bg:#4d4d4d; --badge-fg:#fff;
  --err:#f14c4c; --warn:#cca700; --info:#3794ff;
  --md-code-bg:#ffffff12; --md-border:#ffffff21; --link:#3794ff; --guide:#585858;
  --term-prompt:#23d18b; --term-fg:#cccccc;
  --t-kw:#569cd6; --t-ctrl:#c586c0; --t-str:#ce9178; --t-com:#6a9955; --t-fn:#dcdcaa; --t-type:#4ec9b0; --t-var:#9cdcfe; --t-num:#b5cea8; --t-tag:#569cd6; --t-attr:#9cdcfe; --t-punc:#808080; --t-meta:#569cd6; --t-regex:#d16969; --t-tmpl:#c586c0;
}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ed-bg);color:var(--side-fg);font:13px/1.4 var(--ui);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--title-bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--focus);outline-offset:-1px}
.codicon{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}

#app{height:100%;display:grid;grid-template-rows:35px 1fr 22px;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-sizing:border-box}

/* Title bar */
#titlebar{background:var(--title-bg);color:var(--title-fg);display:grid;grid-template-columns:1fr minmax(0,560px) 1fr;align-items:center;gap:8px;padding:0 8px;user-select:none}
#titlebar .left{display:flex;align-items:center;gap:6px;min-width:0}
.logo{width:22px;height:22px;flex:none}
.tb-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;font-size:12px}
#cc{display:flex;align-items:center;justify-content:center;gap:8px;height:24px;border-radius:6px;border:1px solid var(--cc-border);background:var(--cc-bg);font-size:12px;opacity:.9;min-width:0}
#cc:hover{opacity:1}
#cc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#titlebar .right{display:flex;justify-content:flex-end;gap:2px}
.icon-btn{display:grid;place-items:center;width:28px;height:24px;border-radius:5px}
.icon-btn:hover{background:var(--hover)}
#titlebar .icon-btn:hover{background:#80808033}
.icon-btn[aria-pressed="true"]{opacity:1}
.icon-btn[aria-pressed="false"]{opacity:.55}
#menuBtn{display:none}

/* Workbench */
#work{display:grid;grid-template-columns:48px var(--side-w,260px) minmax(0,1fr);min-height:0}
#work.no-side{grid-template-columns:48px 0 minmax(0,1fr)}
#activity{background:var(--act-bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-right:1px solid var(--act-border)}
#activity .top,#activity .bottom{display:flex;flex-direction:column}
.act{width:48px;height:48px;display:grid;place-items:center;color:var(--act-dim);position:relative}
.act .codicon{width:24px;height:24px;stroke-width:1.3}
.act:hover,.act.active{color:var(--act-fg)}
.act.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--act-fg)}

#sidebar{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.side-head{height:35px;display:flex;align-items:center;padding:0 12px 0 20px;font-size:11px;letter-spacing:.04em;color:var(--side-head);flex:none}
.view{display:none;flex-direction:column;min-height:0;flex:1}
.view.active{display:flex}
.section-head{display:flex;align-items:center;gap:2px;height:22px;font-size:11px;font-weight:700;letter-spacing:.02em;padding-left:2px;flex:none;cursor:pointer}
.section-head .codicon{width:16px;height:16px}
#tree{overflow:auto;flex:1;padding-bottom:12px;outline:none}
.row{display:flex;align-items:center;height:22px;cursor:pointer;white-space:nowrap;position:relative;padding-right:8px}
.row:hover{background:var(--hover)}
.row.selected{background:var(--sel-inactive)}
#tree:focus-within .row.selected{background:var(--sel);color:var(--sel-fg);outline:1px solid var(--focus);outline-offset:-1px}
.row .twisty{width:16px;height:16px;display:grid;place-items:center;flex:none;transition:transform .1s}
.row .twisty.open{transform:rotate(90deg)}
.row .twisty.none{visibility:hidden}
.row .name{overflow:hidden;text-overflow:ellipsis}
.row .badge-count{margin-left:auto;font-size:11px;min-width:14px;padding:0 4px;border-radius:9px;text-align:center}
.row .badge-count.err{color:var(--err)}
.row .badge-count.warn{color:var(--warn)}
.guide{position:absolute;top:0;bottom:0;width:1px;background:var(--guide);opacity:0}
#tree:hover .guide{opacity:.6}
.ficon{width:16px;height:16px;flex:none;margin-right:6px;display:grid;place-items:center;font:700 9px/1 var(--mono);letter-spacing:-.04em}

/* Search view */
.search-box{padding:4px 12px 8px 20px;flex:none}
.search-box input{width:100%;box-sizing:border-box;height:26px;padding:3px 6px;background:var(--input-bg);color:var(--ed-fg);border:1px solid var(--input-border);border-radius:2px;font:13px var(--ui)}
.search-box input:focus{outline:1px solid var(--focus);outline-offset:-1px}
.search-meta{padding:0 12px 6px 20px;font-size:12px;color:var(--muted);flex:none}
#searchResults{overflow:auto;flex:1}
.sr-file{display:flex;align-items:center;height:22px;padding-left:8px;cursor:pointer;white-space:nowrap}
.sr-file:hover,.sr-line:hover{background:var(--hover)}
.sr-file .dir{color:var(--muted);font-size:12px;margin-left:6px;overflow:hidden;text-overflow:ellipsis}
.sr-line{height:22px;line-height:22px;display:block;padding-left:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-size:13px}
.sr-line mark{background:#ea5c0055;color:inherit;border-radius:1px}

/* Editor */
#main{display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);min-width:0;min-height:0;background:var(--ed-bg)}
#editor{display:flex;flex-direction:column;min-height:0;min-width:0}
#tabs{display:flex;background:var(--tabs-bg);height:35px;flex:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
#tabs::-webkit-scrollbar{height:3px}
.tab{display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;min-width:max-content;height:35px;background:var(--tab-bg);color:var(--tab-fg);border-right:1px solid var(--tab-border);cursor:pointer;position:relative;font-size:13px}
.tab.active{background:var(--tab-active-bg);color:var(--tab-active-fg)}
.tab.active::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--focus)}
.tab.preview .tname{font-style:italic}
.tab .close{width:20px;height:20px;display:grid;place-items:center;border-radius:4px;opacity:0}
.tab:hover .close,.tab.active .close{opacity:1}
.tab .close:hover{background:var(--hover)}
.tab .ficon{margin-right:0}
.tabs-actions{margin-left:auto;display:flex;align-items:center;padding:0 6px;gap:2px;background:var(--tabs-bg);position:sticky;right:0}
#crumbs{height:22px;display:flex;align-items:center;gap:2px;padding:0 12px;font-size:13px;color:var(--muted);flex:none;white-space:nowrap;overflow:hidden;background:var(--ed-bg)}
#crumbs .sep{width:14px;height:14px;opacity:.7}
#crumbs .c{cursor:pointer;display:inline-flex;align-items:center;flex:none}
#crumbs .c .ficon{margin-right:4px}
#crumbs .c:hover{color:var(--ed-fg)}
#content{flex:1;overflow:auto;position:relative;background:var(--ed-bg);min-height:0}

/* Code view */
.code{display:grid;grid-template-columns:auto minmax(0,1fr);font:14px/19px var(--mono);font-variant-ligatures:none;color:var(--ed-fg);min-width:max-content;position:relative;padding:4px 0 40vh}
.gutter{text-align:right;color:var(--gutter);padding:0 20px 0 18px;user-select:none;position:sticky;left:0;background:var(--ed-bg);z-index:1}
.gutter div{height:19px}
.gutter div.hl{color:var(--gutter-active)}
.code pre{margin:0;padding:0 40px 0 6px;font:inherit;tab-size:4;white-space:pre}
.line-hl{position:absolute;left:0;right:0;height:19px;background:var(--line-hl);pointer-events:none;border-top:1px solid #80808033;border-bottom:1px solid #80808033;box-sizing:border-box}
.float-actions{position:sticky;top:0;z-index:3;height:0;display:flex;justify-content:flex-end;padding-right:16px}
.float-actions .inner{display:flex;gap:4px;margin-top:8px}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:4px;background:var(--widget-bg);border:1px solid var(--panel-border);font-size:12px;color:var(--side-fg)}
.pill-btn:hover{background:var(--hover)}

/* hljs tokens mapped to VS Code theme tokens */
.hljs-keyword,.hljs-literal,.hljs-built_in.hljs-keyword{color:var(--t-kw)}
.hljs-built_in{color:var(--t-type)}
.hljs-type,.hljs-title.class_,.hljs-title.class_.inherited__{color:var(--t-type)}
.hljs-string,.hljs-template-string{color:var(--t-str)}
.hljs-comment,.hljs-quote{color:var(--t-com)}
.hljs-title.function_,.hljs-title{color:var(--t-fn)}
.hljs-params,.hljs-variable,.hljs-property,.hljs-attr{color:var(--t-var)}
.hljs-number{color:var(--t-num)}
.hljs-tag,.hljs-name{color:var(--t-tag)}
.hljs-tag .hljs-attr,.hljs-attribute{color:var(--t-attr)}
.hljs-selector-tag{color:var(--t-tag)}
.hljs-selector-class,.hljs-selector-id,.hljs-selector-pseudo,.hljs-selector-attr{color:var(--t-fn)}
.hljs-meta,.hljs-meta .hljs-keyword{color:var(--t-meta)}
.hljs-regexp{color:var(--t-regex)}
.hljs-template-tag,.hljs-template-variable{color:var(--t-tmpl)}
.hljs-symbol,.hljs-bullet{color:var(--t-num)}
.hljs-section{color:var(--t-kw);font-weight:700}
.hljs-subst{color:var(--ed-fg)}
.hljs-punctuation{color:var(--t-punc)}
.hljs-tag .hljs-string{color:var(--t-str)}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:700}

/* Markdown preview */
.md{max-width:880px;padding:20px 26px 80px;color:var(--ed-fg);font:14px/1.6 var(--ui);box-sizing:border-box}
.md h1{font-size:2em;font-weight:600;margin:0 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--md-border);line-height:1.25;text-wrap:balance}
.md h2{font-size:1.5em;font-weight:600;margin:1.4em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--md-border);line-height:1.25}
.md p,.md ul,.md ol,.md table,.md pre{margin:0 0 14px}
.md ul,.md ol{padding-left:2em}
.md li{margin:4px 0}
.md li>p{margin:6px 0}
.md a{color:var(--link);text-decoration:none}
.md a:hover{text-decoration:underline}
.md code{font:13px/1.4 var(--mono);background:var(--md-code-bg);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}
.md pre{position:relative;background:var(--md-code-bg);border-radius:4px;padding:12px 14px;overflow-x:auto}
.md pre code{background:none;padding:0;font-size:13px;overflow-wrap:normal;white-space:pre}
.md pre .copy{position:absolute;top:6px;right:6px;opacity:0}
.md pre:hover .copy,.md pre .copy:focus-visible{opacity:1}
.md .tbl{overflow-x:auto;margin:0 0 14px}
.md table{border-collapse:collapse;margin:0}
.md th,.md td{border:1px solid var(--md-border);padding:5px 12px;text-align:left;vertical-align:top}
.md th{font-weight:600}
.md strong{font-weight:600}
.md .week-nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px;padding-top:14px;border-top:1px solid var(--md-border);flex-wrap:wrap}
.md .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:0 0 14px}
.md .shots figure{margin:0;cursor:pointer}
.md .shots img{width:100%;height:140px;object-fit:contain;border:1px solid var(--md-border);border-radius:4px;display:block;background:#fff}
.md .shots figcaption{font-size:12px;color:var(--muted);margin-top:4px}

/* Image view */
.imgview{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;
  background-color:var(--ed-bg);background-image:linear-gradient(45deg,#80808014 25%,transparent 25%,transparent 75%,#80808014 75%),linear-gradient(45deg,#80808014 25%,transparent 25%,transparent 75%,#80808014 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.imgview img{max-width:100%;box-shadow:var(--widget-shadow);background:#fff}
.imgview .cap{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}

/* Panel */
#panel{border-top:1px solid var(--panel-border);background:var(--panel-bg);display:flex;flex-direction:column;height:var(--panel-h,230px);min-height:0}
#panel[hidden]{display:none!important}
.panel-tabs{display:flex;align-items:center;gap:4px;height:35px;padding:0 8px 0 12px;flex:none}
.ptab{height:35px;padding:0 8px;font-size:11px;letter-spacing:.04em;color:var(--muted);position:relative;display:flex;align-items:center;gap:6px}
.ptab:hover{color:var(--ed-fg)}
.ptab.active{color:var(--ed-fg)}
.ptab.active::after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:1px;background:var(--ed-fg)}
.ptab .cnt{background:var(--badge-bg);color:var(--badge-fg);border-radius:9px;padding:0 6px;font-size:11px;letter-spacing:0}
.panel-actions{margin-left:auto;display:flex;gap:2px}
.pbody{flex:1;overflow:auto;min-height:0;display:none}
.pbody.active{display:block}
.prob-group{display:flex;align-items:center;height:22px;padding-left:8px;gap:4px;font-size:13px;color:var(--ed-fg);cursor:pointer;white-space:nowrap}
.prob-group .dir{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.prob-group .cnt{background:var(--badge-bg);color:var(--badge-fg);border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.prob{display:flex;align-items:flex-start;gap:6px;padding:2px 12px 2px 46px;font-size:13px;color:var(--ed-fg);cursor:pointer;line-height:18px}
.prob:hover,.prob-group:hover{background:var(--hover)}
.prob .sev{margin-top:1px}
.prob .ln{color:var(--muted);white-space:nowrap;margin-left:4px}
.sev.error{color:var(--err)}.sev.warning{color:var(--warn)}.sev.info{color:var(--info)}
.prob-note{padding:6px 12px 8px 20px;color:var(--muted);font-size:12px}
.term{font:13px/20px var(--mono);color:var(--term-fg);padding:4px 20px 16px}
.term .note{color:var(--muted)}
.tline{display:flex;align-items:baseline;gap:10px;border-radius:3px;padding:0 6px;margin:0 -6px;cursor:pointer;width:fit-content;max-width:100%}
.tline:hover{background:var(--hover)}
.tline .ps{color:var(--term-prompt);white-space:nowrap}
.tline .cmd{white-space:pre-wrap;overflow-wrap:anywhere}
.tline .hint{color:var(--muted);font-size:12px;opacity:0;white-space:nowrap}
.tline:hover .hint,.tline:focus-visible .hint{opacity:1}
.tcomment{color:var(--t-com);padding-left:0}
.term .cursor{display:inline-block;width:8px;height:15px;background:var(--term-fg);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.outputs{display:flex;gap:12px;padding:8px 20px 16px;overflow-x:auto}
.outputs figure{margin:0;flex:none;width:220px;cursor:pointer}
.outputs img{width:220px;height:130px;object-fit:contain;border:1px solid var(--panel-border);border-radius:3px;background:#fff;display:block}
.outputs figcaption{font-size:12px;color:var(--muted);margin-top:4px}

/* Status bar */
#status{background:var(--status-bg);color:var(--status-fg);display:flex;align-items:stretch;font-size:12px;user-select:none;padding-bottom:env(safe-area-inset-bottom,0px);white-space:nowrap;overflow:hidden}
#status .sb{display:flex;align-items:center;gap:4px;padding:0 8px}
#status button.sb:hover{background:var(--status-hover)}
#status .remote{background:#16825d;padding:0 10px}
#status .spacer{flex:1}
#status .codicon{width:14px;height:14px;stroke:currentColor}

/* Quick open */
#qo{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(44px + env(safe-area-inset-top,0px))}
#qo[hidden]{display:none!important}
.qo-box{width:min(600px,calc(100vw - 32px));background:var(--widget-bg);box-shadow:var(--widget-shadow);border-radius:6px;padding:6px;border:1px solid var(--panel-border)}
.qo-box input{width:100%;box-sizing:border-box;height:28px;padding:3px 8px;background:var(--input-bg);color:var(--ed-fg);border:1px solid var(--focus);border-radius:3px;font:13px var(--ui);outline:none}
#qoList{max-height:min(420px,60vh);overflow:auto;margin-top:6px}
.qo-item{display:flex;align-items:center;height:24px;padding:0 6px;border-radius:3px;cursor:pointer;gap:2px;white-space:nowrap;overflow:hidden;color:var(--ed-fg)}
.qo-item .dir{color:var(--muted);font-size:12px;margin-left:8px;overflow:hidden;text-overflow:ellipsis}
.qo-item.on{background:var(--sel);color:var(--sel-fg)}
.qo-item.on .dir{color:inherit;opacity:.8}
.qo-item b{color:var(--link)}
.qo-item.on b{color:inherit}

#toast{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--widget-bg);color:var(--ed-fg);box-shadow:var(--widget-shadow);border:1px solid var(--panel-border);padding:8px 12px;border-radius:4px;font-size:13px;display:flex;gap:8px;align-items:center}
#toast[hidden]{display:none!important}
#scrim{display:none}

@media (max-width:760px){
  #titlebar{grid-template-columns:auto minmax(0,1fr) auto;padding:0 6px}
  #menuBtn{display:grid}
  .tb-title,#titlebar .logo{display:none}
  #work,#work.no-side{grid-template-columns:minmax(0,1fr)}
  #activity{display:none}

    padding-left:env(safe-area-inset-left,0px);box-shadow:var(--widget-shadow);transform:translateX(-105%);transition:transform .18s ease}
  #work.drawer #sidebar{transform:none}
  #work.drawer #scrim{display:block;position:fixed;inset:0;z-index:14;background:#0000004d}
  .code{font-size:13px;line-height:18px}
  .gutter div{height:18px}

  #status .hide-sm{display:none}
  .tab{padding:0 4px 0 8px}
}

<script id="lab-data" type="application/json">{"files": {"README.md": {"kind": "text", "text": "# Django Lab — R25\n\n**II B.Tech I Semester · Course code A253585 · L T P C: 0 0 2 1**\n\nDepartment of CSE (AI & ML), Vidya Jyothi Institute of Technology, Hyderabad.\n\nEvery week of the lab manual is a folder on the left. Open a week's `README.md` for the steps, then open each file the steps mention. Commands for the week are in the **Terminal** panel below, and anything that differs from the printed manual is listed under **Problems**.\n\n## Course outcomes\n\nAt the end of the course, the student will be able to:\n\n1. Design and develop a responsive web application using HTML & CSS.\n2. Build a responsive web application using JavaScript, CSS, Flex & Grid.\n3. Demonstrate understanding of the Django framework.\n4. Implement mailing, cache and session management in the Django framework.\n5. Analyze, design, develop and implement complete web applications using the Django framework.\n\n## List of experiments\n\n| Week | Experiment | Manual pages |\n|---|---|---|\n| 1 | [Responsive registration form](open:week01-registration-form/README.md) — User Name, Password, Date of Birth, Gender, Mail-id, Contact Number, Address and Submit button | 4–12 |\n| 2 | [JavaScript validation of the registration page using regular expressions](open:week02-regex-validation/README.md) | 13–16 |\n| 3 | [Responsive shopping cart with Registration, Login, Catalog and Cart pages using CSS3, Flex and Grid](open:week03-shopping-cart-ui/README.md) | 17–31 |\n| 4 | [Basics of the Django framework and installing the required software](open:week04-django-basics/README.md) | 32–38 |\n| 5 | [Shopping cart web application with a customised admin page for product catalog management](open:week05-shopping-cart-admin/README.md) | 39–49 |\n| 6 | [Cache and session management for a student login application](open:week06-cache-session-login/README.md) | 50–56 |\n| 7 | [Quiz application using Django with SQLite3](open:week07-quiz-app/README.md) | 57–63 |\n| 8 | [Django application using generic views and forms](open:week08-generic-views-forms/README.md) | 64–72 |\n| 9 | [Application for working with mails](open:week09-mail-app/README.md) | 73–91 |\n| 10 | [Weather app: current and historical weather from openweathermap.org, charted with Chart.js](open:week10-weather-dashboard/README.md) | 92–110 |\n| 11 | [Case study: VJIT Student Portal, deployed to GitHub](open:week11-vjit-student-portal/README.md) | 111–115 |\n\n## Before you start\n\n- Install **Python 3** from python.org and tick *Add Python to PATH*.\n- Install **VS Code** and the **Python** extension.\n- Weeks 1–3 need only a browser. Open the `.html` file directly.\n- Weeks 4–11 are Django projects. Each one starts with a new virtual environment.\n\n## Reference books\n\n1. *Web Technologies: HTML, CSS, JavaScript* — Uttam K. Roy\n2. *Django for Beginners: Build Websites with Python and Django* — William S. Vincent\n3. *Python Web Development with Django* — Jeff Forcier, Paul Bissex, Wesley Chun\n\n## Web links\n\n- W3Schools web development tutorials — https://www.w3schools.com\n- JavaScript regular expressions guide (MDN) — https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions\n- Python documentation — https://www.python.org/doc/\n- Python tutorial (W3Schools) — https://www.w3schools.com/python/\n- Django documentation — https://docs.djangoproject.com\n- Django tutorials — https://www.djangoproject.com/start/\n"}, "week05-shopping-cart-admin/README.md": {"kind": "text", "text": "# Week 5 — Shopping Cart with a Custom Admin Page\n\n**Aim:** Create a shopping cart web application and add a customised admin page for product catalog management (for Experiment 3).\n\n## Project structure\n\n```text\nshopping_cart/\n├── manage.py\n├── shopping_cart/          # project settings\n│   ├── settings.py\n│   └── urls.py\n└── shop/                   # main app\n    ├── admin.py\n    ├── models.py\n    ├── views.py\n    ├── urls.py\n    ├── forms.py\n    └── templates/\n        ├── base.html\n        ├── registration.html\n        ├── login.html\n        ├── catalog.html\n        └── cart.html\n```\n\n## Steps\n\n1. **Set up the project:**\n\n   ```bash\n   python -m venv week5\n   week5\\Scripts\\activate\n   pip install django\n   django-admin startproject shopping_cart\n   cd shopping_cart\n   python manage.py startapp shop\n   ```\n\n2. **Edit settings.** In [shopping_cart/settings.py](open:week05-shopping-cart-admin/shopping_cart/shopping_cart/settings.py) add `'shop'` to `INSTALLED_APPS` and set `LOGIN_URL`, `LOGIN_REDIRECT_URL` and `LOGOUT_REDIRECT_URL`.\n3. **Write the views** in [shop/views.py](open:week05-shopping-cart-admin/shopping_cart/shop/views.py): `register`, `catalog`, `add_to_cart`, `cart` and `update_cart`. All except `register` use `@login_required`.\n4. **Write the models** in [shop/models.py](open:week05-shopping-cart-admin/shopping_cart/shop/models.py): `Product` (name, price, description) and `CartItem` (user, product, quantity) with a `subtotal()` method.\n5. **Write the forms** in [shop/forms.py](open:week05-shopping-cart-admin/shopping_cart/shop/forms.py): `RegistrationForm` (extends `UserCreationForm` with email) and `CartItemForm` (quantity only).\n6. **Customise the admin** in [shop/admin.py](open:week05-shopping-cart-admin/shopping_cart/shop/admin.py). `list_display` picks the columns, `search_fields` adds the search box — this is the custom product catalog page.\n7. **Map the URLs** in [shop/urls.py](open:week05-shopping-cart-admin/shopping_cart/shop/urls.py) (login and logout use Django's built-in `LoginView` and `LogoutView`) and include them from [shopping_cart/urls.py](open:week05-shopping-cart-admin/shopping_cart/shopping_cart/urls.py).\n8. **Create the templates** in `shop/templates/`: [base.html](open:week05-shopping-cart-admin/shopping_cart/shop/templates/base.html), [registration.html](open:week05-shopping-cart-admin/shopping_cart/shop/templates/registration.html), [login.html](open:week05-shopping-cart-admin/shopping_cart/shop/templates/login.html), [catalog.html](open:week05-shopping-cart-admin/shopping_cart/shop/templates/catalog.html) and [cart.html](open:week05-shopping-cart-admin/shopping_cart/shop/templates/cart.html). Each page `{% extends 'base.html' %}`.\n9. **Create the database and an admin user:**\n\n   ```bash\n   python manage.py makemigrations\n   python manage.py migrate\n   python manage.py createsuperuser\n   python manage.py runserver\n   ```\n\n10. **Add products** at http://127.0.0.1:8000/admin/ → *Products* → *Add product* ([screenshot](open:week05-shopping-cart-admin/output/admin-add-product.jpg)).\n11. **Use the shop.** There is no page at `/` ([404 screenshot](open:week05-shopping-cart-admin/output/404-root.jpg)), so start at http://127.0.0.1:8000/register/ or `/catalog/`. Add items, then change quantities in the cart and press **Update**.\n"}, "week05-shopping-cart-admin/shopping_cart/shopping_cart/settings.py": {"kind": "text", "text": "# shopping_cart/settings.py\n# Only the parts you change are shown. Keep everything else that\n# \"django-admin startproject\" generated.\n\nINSTALLED_APPS = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'shop',\n]\n\nLOGIN_URL = 'login'              # added: where @login_required sends users\nLOGIN_REDIRECT_URL = 'catalog'\nLOGOUT_REDIRECT_URL = 'login'\n"}, "week05-shopping-cart-admin/shopping_cart/shopping_cart/urls.py": {"kind": "text", "text": "# shopping_cart/urls.py  (project-level)\nfrom django.contrib import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', include('shop.urls')),\n]\n"}, "week05-shopping-cart-admin/shopping_cart/shop/admin.py": {"kind": "text", "text": "# shop/admin.py\nfrom django.contrib import admin\nfrom .models import Product, CartItem\n\n@admin.register(Product)\nclass ProductAdmin(admin.ModelAdmin):\n    list_display = ('name', 'price', 'description')\n    search_fields = ('name',)\n\n@admin.register(CartItem)\nclass CartItemAdmin(admin.ModelAdmin):\n    list_display = ('user', 'product', 'quantity', 'subtotal')\n"}, "week05-shopping-cart-admin/shopping_cart/shop/models.py": {"kind": "text", "text": "# shop/models.py\nfrom django.db import models\nfrom django.contrib.auth.models import User\n\nclass Product(models.Model):\n    name = models.CharField(max_length=100)\n    price = models.DecimalField(max_digits=8, decimal_places=2)\n    description = models.TextField(blank=True)\n\n    def __str__(self):\n        return self.name\n\nclass CartItem(models.Model):\n    user = models.ForeignKey(User, on_delete=models.CASCADE)\n    product = models.ForeignKey(Product, on_delete=models.CASCADE)\n    quantity = models.PositiveIntegerField(default=1)\n\n    def subtotal(self):\n        return self.product.price * self.quantity\n"}, "week05-shopping-cart-admin/shopping_cart/shop/forms.py": {"kind": "text", "text": "# shop/forms.py  (create this file)\nfrom django import forms\nfrom django.contrib.auth.models import User\nfrom django.contrib.auth.forms import UserCreationForm\nfrom .models import CartItem\n\nclass RegistrationForm(UserCreationForm):\n    email = forms.EmailField(required=True)\n\n    class Meta:\n        model = User\n        fields = ['username', 'email', 'password1', 'password2']\n\nclass CartItemForm(forms.ModelForm):\n    class Meta:\n        model = CartItem\n        fields = ['quantity']\n"}, "week05-shopping-cart-admin/shopping_cart/shop/views.py": {"kind": "text", "text": "# shop/views.py\nfrom django.shortcuts import render, redirect, get_object_or_404\nfrom django.contrib.auth import login\nfrom django.contrib.auth.decorators import login_required\nfrom .forms import RegistrationForm, CartItemForm\nfrom .models import Product, CartItem\n\ndef register(request):\n    if request.method == 'POST':\n        form = RegistrationForm(request.POST)\n        if form.is_valid():\n            user = form.save()\n            login(request, user)\n            return redirect('catalog')\n    else:\n        form = RegistrationForm()\n    return render(request, 'registration.html', {'form': form})\n\n@login_required\ndef catalog(request):\n    products = Product.objects.all()\n    return render(request, 'catalog.html', {'products': products})\n\n@login_required\ndef add_to_cart(request, product_id):\n    product = get_object_or_404(Product, id=product_id)\n    cart_item, created = CartItem.objects.get_or_create(user=request.user, product=product)\n    if not created:\n        cart_item.quantity += 1\n    cart_item.save()\n    return redirect('cart')\n\n@login_required\ndef cart(request):\n    items = CartItem.objects.filter(user=request.user)\n    total = sum(item.subtotal() for item in items)\n    return render(request, 'cart.html', {'items': items, 'total': total})\n\n@login_required\ndef update_cart(request, item_id):\n    item = get_object_or_404(CartItem, id=item_id, user=request.user)\n    if request.method == 'POST':\n        form = CartItemForm(request.POST, instance=item)\n        if form.is_valid():\n            form.save()\n    return redirect('cart')\n"}, "week05-shopping-cart-admin/shopping_cart/shop/urls.py": {"kind": "text", "text": "# shop/urls.py  (create this file)\nfrom django.urls import path\nfrom django.contrib.auth import views as auth_views\nfrom . import views\n\nurlpatterns = [\n    path('register/', views.register, name='register'),\n    path('catalog/', views.catalog, name='catalog'),\n    path('cart/', views.cart, name='cart'),\n    path('add/<int:product_id>/', views.add_to_cart, name='add_to_cart'),\n    path('update/<int:item_id>/', views.update_cart, name='update_cart'),\n    path('login/', auth_views.LoginView.as_view(template_name='login.html'), name='login'),\n    path('logout/', auth_views.LogoutView.as_view(), name='logout'),\n]\n"}, "week05-shopping-cart-admin/shopping_cart/shop/templates/cart.html": {"kind": "text", "text": "{% extends 'base.html' %}\n{% block content %}\n<h2>Your Cart<\/h2>\n<ul>\n  {% for item in items %}\n    <li>\n      {{ item.product.name }} (x{{ item.quantity }}) - ${{ item.subtotal }}\n      <form method=\"post\" action=\"{% url 'update_cart' item.id %}\">\n        {% csrf_token %}\n        {{ item.quantity }}\n        <input type=\"number\" name=\"quantity\" value=\"{{ item.quantity }}\" min=\"1\">\n        <button type=\"submit\">Update<\/button>\n      <\/form>\n    <\/li>\n  {% endfor %}\n<\/ul>\n<p>Total: ${{ total }}<\/p>\n{% endblock %}\n"}, "week05-shopping-cart-admin/shopping_cart/shop/templates/login.html": {"kind": "text", "text": "{% extends 'base.html' %}\n{% block content %}\n<h2>Login<\/h2>\n<form method=\"post\">\n  {% csrf_token %}\n  {{ form.as_p }}\n  <button type=\"submit\">Login<\/button>\n<\/form>\n<p>Don't have an account yet? <a href=\"{% url 'register' %}\">Register here<\/a>.<\/p>\n{% endblock %}\n"}, "week05-shopping-cart-admin/shopping_cart/shop/templates/catalog.html": {"kind": "text", "text": "{% extends 'base.html' %}\n{% block content %}\n<h2>Product Catalog<\/h2>\n<ul>\n  {% for product in products %}\n    <li>{{ product.name }} - ${{ product.price }}\n      <a href=\"{% url 'add_to_cart' product.id %}\">Add to Cart<\/a>\n    <\/li>\n  {% endfor %}\n<\/ul>\n{% endblock %}\n"}, "week05-shopping-cart-admin/shopping_cart/shop/templates/base.html": {"kind": "text", "text": "<!DOCTYPE html>\n<html>\n<head>\n  <title>Shopping Cart<\/title>\n<\/head>\n<body>\n  <nav>\n    <a href=\"{% url 'catalog' %}\">Catalog<\/a> |\n    <a href=\"{% url 'cart' %}\">Cart<\/a> |\n    {% if user.is_authenticated %}\n      <!-- Django 5+ logs out only with POST, so Logout is a small form -->\n      <form method=\"post\" action=\"{% url 'logout' %}\" style=\"display:inline\">\n        {% csrf_token %}\n        <button type=\"submit\">Logout<\/button>\n      <\/form>\n    {% else %}\n      <a href=\"{% url 'login' %}\">Login<\/a> |\n      <a href=\"{% url 'register' %}\">Register<\/a>\n    {% endif %}\n  <\/nav>\n  <hr>\n  {% block content %}{% endblock %}\n<\/body>\n<\/html>\n"}, "week05-shopping-cart-admin/shopping_cart/shop/templates/registration.html": {"kind": "text", "text": "{% extends 'base.html' %}\n{% block content %}\n<h2>Create an Account<\/h2>\n<form method=\"post\">\n  {% csrf_token %}\n  {{ form.as_p }}\n  <button type=\"submit\">Register<\/button>\n<\/form>\n<p>Already have an account? <a href=\"{% url 'login' %}\">Login here<\/a>.<\/p>\n{% endblock %}\n"}, "week11-vjit-student-portal/README.md": {"kind": "text", "text": "# Week 11 — Case Study: VJIT Student Portal, Deployed to GitHub\n\n**Aim:** Build a Django application for the VJIT Student Portal and deploy it to GitHub.\n\n## Apps in the portal\n\n| App | Holds |\n|---|---|\n| `main` | Homepage, About, Contact |\n| `academics` | Departments, Courses |\n| `admissions` | Admission info, forms |\n| `events` | News, Events, Announcements |\n| `students` | Student portal, results, notices |\n\nThe manual builds `main` and `academics`; the other three follow the same pattern.\n\n## Step 1 — Build the site\n\n1. **Create the project and apps:**\n\n   ```bash\n   python -m venv week11\n   week11\\Scripts\\activate\n   pip install django\n   django-admin startproject vjit_site\n   cd vjit_site\n   python manage.py startapp main\n   python manage.py startapp academics\n   ```\n\n2. **Register the apps** in [vjit_site/settings.py](open:week11-vjit-student-portal/vjit_site/vjit_site/settings.py).\n3. **Write the model** [academics/models.py](open:week11-vjit-student-portal/vjit_site/academics/models.py) (`Department`) and register it in [academics/admin.py](open:week11-vjit-student-portal/vjit_site/academics/admin.py).\n4. **Write the home view** [main/views.py](open:week11-vjit-student-portal/vjit_site/main/views.py) and its template [main/templates/main/home.html](open:week11-vjit-student-portal/vjit_site/main/templates/main/home.html).\n5. **Add the academics page** — [academics/views.py](open:week11-vjit-student-portal/vjit_site/academics/views.py), [academics/urls.py](open:week11-vjit-student-portal/vjit_site/academics/urls.py) and [department_list.html](open:week11-vjit-student-portal/vjit_site/academics/templates/academics/department_list.html).\n6. **Map the project URLs** in [vjit_site/urls.py](open:week11-vjit-student-portal/vjit_site/vjit_site/urls.py).\n7. **Run it:**\n\n   ```bash\n   python manage.py makemigrations\n   python manage.py migrate\n   python manage.py createsuperuser\n   python manage.py runserver\n   ```\n\n## Step 2 — Put the project on GitHub\n\n1. **Create a GitHub account** and install Git (`git --version` to check).\n2. **Save your packages and ignore local files:**\n\n   ```bash\n   pip install gunicorn\n   pip freeze > requirements.txt\n   ```\n\n   Add a [.gitignore](open:week11-vjit-student-portal/vjit_site/.gitignore) so `venv/`, `db.sqlite3` and `.env` are not uploaded. A minimal [requirements.txt](open:week11-vjit-student-portal/vjit_site/requirements.txt) is shown too.\n3. **Commit locally:**\n\n   ```bash\n   git init\n   git add .\n   git commit -m \"Initial commit\"\n   ```\n\n4. **Create a repository on GitHub** — click *New repository*, name it (e.g. `vjit-app`), choose Public or Private, and do not add a README.\n5. **Link and push:**\n\n   ```bash\n   git remote add origin https://github.com/your-username/vjit-app.git\n   git branch -M main\n   git push -u origin main\n   ```\n\n## Step 3 — Hosting\n\n**GitHub Pages** only hosts static HTML/CSS/JS. For a static site: push the code, go to *Settings → Pages*, choose branch `main` and folder `/ (root)` or `/docs`, and save. GitHub gives you a URL like `https://your-username.github.io/vjit-app/`.\n\n**GitHub cannot run Django** — Django needs Python and a server. Use a Python host such as PythonAnywhere or Render.\n\n**Deploy with Render:**\n\n1. Push the project to GitHub (Step 2).\n2. Sign in at render.com and create a new **Web Service** connected to your repository.\n3. **Build Command:** `pip install -r requirements.txt && python manage.py migrate`\n4. **Start Command:** `gunicorn vjit_site.wsgi:application`\n5. Add environment variables (for example `PYTHON_VERSION`), and add `'.onrender.com'` to `ALLOWED_HOSTS`.\n6. Deploy — Render gives you a live URL such as `https://vjit-django.onrender.com`.\n"}, "week11-vjit-student-portal/vjit_site/requirements.txt": {"kind": "text", "text": "Django>=4.2\ngunicorn>=21.2\n"}, "week11-vjit-student-portal/vjit_site/.gitignore": {"kind": "text", "text": "venv/\n__pycache__/\n*.pyc\ndb.sqlite3\n.env\n"}, "week11-vjit-student-portal/vjit_site/academics/admin.py": {"kind": "text", "text": "# academics/admin.py\nfrom django.contrib import admin\nfrom .models import Department\n\nadmin.site.register(Department)\n"}, "week11-vjit-student-portal/vjit_site/academics/models.py": {"kind": "text", "text": "# academics/models.py\nfrom django.db import models\n\nclass Department(models.Model):\n    name = models.CharField(max_length=100)\n    hod = models.CharField(max_length=100)\n    description = models.TextField()\n    contact_email = models.EmailField()\n\n    def __str__(self):\n        return self.name\n"}, "week11-vjit-student-portal/vjit_site/academics/views.py": {"kind": "text", "text": "# academics/views.py\n# added: the project urls.py includes 'academics.urls', so the app needs\n# at least one view. This one lists the departments added in admin.\nfrom django.shortcuts import render\nfrom .models import Department\n\ndef department_list(request):\n    departments = Department.objects.all()\n    return render(request, 'academics/department_list.html', {'departments': departments})\n"}, "week11-vjit-student-portal/vjit_site/academics/urls.py": {"kind": "text", "text": "# academics/urls.py  (added - create this file)\nfrom django.urls import path\nfrom . import views\n\nurlpatterns = [\n    path('', views.department_list, name='department_list'),\n]\n"}, "week11-vjit-student-portal/vjit_site/academics/templates/academics/department_list.html": {"kind": "text", "text": "<!-- added: page for /academics/ -->\n<!DOCTYPE html>\n<html>\n<head>\n  <title>VJIT - Academics<\/title>\n<\/head>\n<body>\n  <h1>Departments<\/h1>\n  <p><a href=\"/\">Home<\/a><\/p>\n  <ul>\n    {% for dept in departments %}\n      <li>\n        <strong>{{ dept.name }}<\/strong> - HOD: {{ dept.hod }}<br>\n        {{ dept.description }}<br>\n        Contact: {{ dept.contact_email }}\n      <\/li>\n    {% empty %}\n      <li>No departments yet. Add them at /admin/.<\/li>\n    {% endfor %}\n  <\/ul>\n<\/body>\n<\/html>\n"}, "week11-vjit-student-portal/vjit_site/vjit_site/settings.py": {"kind": "text", "text": "# vjit_site/settings.py\n# Only the parts you change are shown. Keep everything else that\n# \"django-admin startproject\" generated.\n\nINSTALLED_APPS = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'main',\n    'academics',\n]\n\n# For deployment on Render, also allow its domain:\n# ALLOWED_HOSTS = ['localhost', '127.0.0.1', '.onrender.com']\n"}, "week11-vjit-student-portal/vjit_site/vjit_site/urls.py": {"kind": "text", "text": "# vjit_site/urls.py  (project level url mapping)\nfrom django.contrib import admin\nfrom django.urls import path, include\nfrom main import views as main_views\n\nurlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', main_views.home, name='home'),\n    path('academics/', include('academics.urls')),\n]\n"}, "week11-vjit-student-portal/vjit_site/main/views.py": {"kind": "text", "text": "# main/views.py\nfrom django.shortcuts import render\n\ndef home(request):\n    return render(request, 'main/home.html')\n"}, "week11-vjit-student-portal/vjit_site/main/templates/main/home.html": {"kind": "text", "text": "<!DOCTYPE html>\n<html>\n<head>\n  <title>VJIT - Home<\/title>\n<\/head>\n<body>\n  <h1>Welcome to Vidya Jyothi Institute of Technology<\/h1>\n  <nav>\n    <a href=\"/academics/\">Academics<\/a> |\n    <a href=\"/admissions/\">Admissions<\/a> |\n    <a href=\"/events/\">Events<\/a>\n  <\/nav>\n<\/body>\n<\/html>\n"}, "week02-regex-validation/README.md": {"kind": "text", "text": "# Week 2 — Validate the Registration Page with Regular Expressions\n\n**Aim:** Write a JavaScript program to validate the registration page using regular expressions.\n\n## Steps\n\n1. **Create the form.** Make [registration_validation.html](open:week02-regex-validation/registration_validation.html). The fields have **no** `required` attributes, so all checking is done by JavaScript.\n2. **Collect the values** inside the `submit` listener with `document.getElementById(...).value.trim()`. Gender is read with `document.querySelector('input[name=\"gender\"]:checked')`.\n3. **Define the patterns:**\n\n   | Field | Regular expression | Rule |\n   |---|---|---|\n   | User Name | `/^[A-Za-z0-9_]{3,15}$/` | 3–15 letters, numbers or underscores |\n   | Password | `/^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{6,}$/` | at least 6 characters, at least 1 letter and 1 number |\n   | Mail-id | `/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/` | basic `name@domain.ext` format |\n   | Contact Number | `/^[0-9]{10}$/` | exactly 10 digits |\n\n4. **Check each field in order** with `regex.test(value)`. On the first failure show an `alert(...)` and `return`. Date of Birth and Gender only need to be filled; Address must be at least 5 characters.\n5. **Show success** with *Form submitted successfully!* when every check passes.\n6. **Test it** with a bad user name such as `ab` — you should see the alert in [output/invalid-username-alert.jpg](open:week02-regex-validation/output/invalid-username-alert.jpg).\n"}, "week02-regex-validation/registration_validation.html": {"kind": "text", "text": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Registration Form with Validation<\/title>\n<\/head>\n<body>\n  <h2>Registration Form<\/h2>\n  <form id=\"registrationForm\">\n    <p>\n      <label for=\"username\">User Name:<\/label><br>\n      <input type=\"text\" id=\"username\" name=\"username\" placeholder=\"Username\">\n    <\/p>\n\n    <p>\n      <label for=\"password\">Password:<\/label><br>\n      <input type=\"password\" id=\"password\" name=\"password\" placeholder=\"Password\">\n    <\/p>\n\n    <p>\n      <label for=\"dob\">Date of Birth:<\/label><br>\n      <input type=\"date\" id=\"dob\" name=\"dob\">\n    <\/p>\n\n    <p>\n      <label>Gender:<\/label><br>\n      <input type=\"radio\" name=\"gender\" value=\"male\"> Male\n      <input type=\"radio\" name=\"gender\" value=\"female\"> Female\n      <input type=\"radio\" name=\"gender\" value=\"other\"> Other\n    <\/p>\n\n    <p>\n      <label for=\"email\">Mail-id:<\/label><br>\n      <input type=\"email\" id=\"email\" name=\"email\" placeholder=\"Email id\">\n    <\/p>\n\n    <p>\n      <label for=\"contact\">Contact Number:<\/label><br>\n      <input type=\"tel\" id=\"contact\" name=\"contact\" placeholder=\"10-digit number\">\n    <\/p>\n\n    <p>\n      <label for=\"address\">Address:<\/label><br>\n      <textarea id=\"address\" name=\"address\" rows=\"3\" placeholder=\"address\"><\/textarea>\n    <\/p>\n\n    <p>\n      <button type=\"submit\">Submit<\/button>\n    <\/p>\n  <\/form>\n\n  <script>\n    document.getElementById(\"registrationForm\").addEventListener(\"submit\", function(event) {\n      event.preventDefault(); // Prevent default submission\n\n      // Collect values\n      const username = document.getElementById(\"username\").value.trim();\n      const password = document.getElementById(\"password\").value.trim();\n      const dob = document.getElementById(\"dob\").value;\n      const gender = document.querySelector('input[name=\"gender\"]:checked');\n      const email = document.getElementById(\"email\").value.trim();\n      const contact = document.getElementById(\"contact\").value.trim();\n      const address = document.getElementById(\"address\").value.trim();\n\n      // Regex patterns\n      const usernameRegex = /^[A-Za-z0-9_]{3,15}$/;                    // 3–15 chars, letters, numbers, underscore\n      const passwordRegex = /^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{6,}$/;   // min 6 chars, at least 1 letter & 1 number\n      const emailRegex = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;                 // basic email format\n      const contactRegex = /^[0-9]{10}$/;                              // exactly 10 digits\n\n      // Validation checks\n      if (!usernameRegex.test(username)) {\n        alert(\"Invalid Username: Use 3–15 letters, numbers, or underscores.\");\n        return;\n      }\n\n      if (!passwordRegex.test(password)) {\n        alert(\"Invalid Password: Must be at least 6 characters with letters and numbers.\");\n        return;\n      }\n\n      if (!dob) {\n        alert(\"Please enter your Date of Birth.\");\n        return;\n      }\n\n      if (!gender) {\n        alert(\"Please select your Gender.\");\n        return;\n      }\n\n      if (!emailRegex.test(email)) {\n        alert(\"Invalid Email format.\");\n        return;\n      }\n\n      if (!contactRegex.test(contact)) {\n        alert(\"Invalid Contact Number: Must be exactly 10 digits.\");\n        return;\n      }\n\n      if (address.length < 5) {\n        alert(\"Address must be at least 5 characters long.\");\n        return;\n      }\n\n      // If all validations pass\n      alert(\"Form submitted successfully!\");\n    });\n  <\/script>\n<\/body>\n<\/html>\n"}, "week06-cache-session-login/README.md": {"kind": "text", "text": "# Week 6 — Cache & Session Management for Student Login\n\n**Aim:** Demonstrate cache and session management for a student login application.\n\n## Project structure\n\n```text\nstudent_login_project/\n├── manage.py\n├── student_login_project/\n│   ├── settings.py        # cache + session settings\n│   └── urls.py            # project-level routing\n├── studentlogin/\n│   ├── admin.py           # register Student model\n│   ├── models.py          # Student model (username, password)\n│   ├── views.py           # login, logout, dashboard (cache + session + cookie)\n│   ├── urls.py            # app routes\n│   └── templates/\n│       ├── login.html\n│       └── dashboard.html\n└── db.sqlite3\n```\n\n## Steps\n\n1. **Create an environment:**\n\n   ```bash\n   python -m venv week6\n   week6\\Scripts\\activate\n   pip install django\n   ```\n\n2. **Create the project** `student_login_project`:\n\n   ```bash\n   django-admin startproject student_login_project\n   cd student_login_project\n   ```\n\n3. **Create the app** `studentlogin`:\n\n   ```bash\n   python manage.py startapp studentlogin\n   ```\n\n4. **Configure settings** in [student_login_project/settings.py](open:week06-cache-session-login/student_login_project/student_login_project/settings.py): add the app, set `TEMPLATES`, add the `CACHES` block (`LocMemCache`) and `SESSION_ENGINE` (database-backed sessions).\n5. **Create the model** in [studentlogin/models.py](open:week06-cache-session-login/student_login_project/studentlogin/models.py). `save()` hashes the password with `make_password`; `check_password()` compares a typed password with the hash.\n6. **Register the model** in [studentlogin/admin.py](open:week06-cache-session-login/student_login_project/studentlogin/admin.py).\n7. **Write the views** in [studentlogin/views.py](open:week06-cache-session-login/student_login_project/studentlogin/views.py). `login_view` shows all three techniques:\n   1. **Cache** — `cache.get(username)` first; on a miss, read the database and `cache.set(username, student, timeout=300)`.\n   2. **Session** — store `student_id` and `username` in `request.session`.\n   3. **Cookie** — `response.set_cookie(\"student_username\", ..., max_age=3600)`.\n\n   `logout_view` calls `request.session.flush()` and `response.delete_cookie(...)`.\n8. **Map the URLs** in [studentlogin/urls.py](open:week06-cache-session-login/student_login_project/studentlogin/urls.py) (app level) and [student_login_project/urls.py](open:week06-cache-session-login/student_login_project/student_login_project/urls.py) (project level).\n9. **Create the templates** in `studentlogin/templates/`: [login.html](open:week06-cache-session-login/student_login_project/studentlogin/templates/login.html) and [dashboard.html](open:week06-cache-session-login/student_login_project/studentlogin/templates/dashboard.html).\n10. **Migrate, create an admin and run:**\n\n    ```bash\n    python manage.py makemigrations\n    python manage.py migrate\n    python manage.py createsuperuser\n    python manage.py runserver\n    ```\n\n11. **Test it.** Add a student at http://127.0.0.1:8000/admin/, log in at `/login/`, open `/dashboard/`, then `/logout/`. In the browser press `F12` → *Application* → *Cookies* to watch `sessionid` and `student_username` appear and disappear ([dashboard](open:week06-cache-session-login/output/dashboard-cookie.jpg), [logout](open:week06-cache-session-login/output/logout-cookie.jpg)).\n"}, "week06-cache-session-login/student_login_project/studentlogin/admin.py": {"kind": "text", "text": "# studentlogin/admin.py\nfrom django.contrib import admin\nfrom .models import Student\n\n@admin.register(Student)\nclass StudentAdmin(admin.ModelAdmin):\n    list_display = (\"username\",)\n"}, "week06-cache-session-login/student_login_project/studentlogin/models.py": {"kind": "text", "text": "# studentlogin/models.py\nfrom django.db import models\nfrom django.contrib.auth.hashers import make_password, check_password, identify_hasher\n\nclass Student(models.Model):\n    username = models.CharField(max_length=50, unique=True)\n    password = models.CharField(max_length=128)  # hashed password\n\n    def save(self, *args, **kwargs):\n        # Hash only a plain password, so editing a student in admin\n        # does not hash the already-hashed value again.\n        try:\n            identify_hasher(self.password)\n        except ValueError:\n            self.password = make_password(self.password)\n        super().save(*args, **kwargs)\n\n    def check_password(self, raw_password):\n        return check_password(raw_password, self.password)\n\n    def __str__(self):\n        return self.username\n"}, "week06-cache-session-login/student_login_project/studentlogin/views.py": {"kind": "text", "text": "# studentlogin/views.py\nfrom django.shortcuts import render\nfrom django.http import HttpResponse\nfrom django.core.cache import cache\nfrom .models import Student\n\ndef login_view(request):\n    if request.method == \"POST\":\n        username = request.POST.get(\"username\")\n        password = request.POST.get(\"password\")\n\n        # 1 Check cache first\n        student = cache.get(username)\n        if not student:\n            try:\n                student = Student.objects.get(username=username)\n                cache.set(username, student, timeout=300)  # cache for 5 mins\n            except Student.DoesNotExist:\n                return HttpResponse(\"Invalid username\")\n\n        # 2 Validate password\n        if student.check_password(password):\n            # 3 Create session\n            request.session[\"student_id\"] = student.id\n            request.session[\"username\"] = student.username\n\n            # 4 Create cookie\n            response = HttpResponse(f\"Welcome {student.username}!\")\n            response.set_cookie(\"student_username\", student.username, max_age=3600)\n            return response\n        else:\n            return HttpResponse(\"Invalid password\")\n    return render(request, \"login.html\")\n\n# dashboard\ndef dashboard_view(request):\n    if \"student_id\" in request.session:\n        return HttpResponse(f\"Welcome {request.session['username']}! <a href='/logout/'>Logout<\/a>\")\n    else:\n        return HttpResponse(\"Please login first.\")\n\n# logout\ndef logout_view(request):\n    # Clear session\n    request.session.flush()\n\n    # Clear cookie\n    response = HttpResponse(\"Logged out successfully!\")\n    response.delete_cookie(\"student_username\")\n    return response\n"}, "week06-cache-session-login/student_login_project/studentlogin/urls.py": {"kind": "text", "text": "# studentlogin/urls.py  (app level - create this file)\nfrom django.urls import path\nfrom . import views\n\nurlpatterns = [\n    path('login/', views.login_view, name='login'),\n    path('logout/', views.logout_view, name='logout'),\n    path('dashboard/', views.dashboard_view, name='dashboard'),  # optional\n]\n"}, "week06-cache-session-login/student_login_project/studentlogin/templates/dashboard.html": {"kind": "text", "text": "<h2>Welcome {{ request.session.username }}<\/h2>\n<p>You are logged in as student ID: {{ request.session.student_id }}<\/p>\n\n<!-- Logout link -->\n<a href=\"{% url 'logout' %}\">Logout<\/a>\n"}, "week06-cache-session-login/student_login_project/studentlogin/templates/login.html": {"kind": "text", "text": "<form method=\"post\">\n  {% csrf_token %}\n  <label>Username:<\/label>\n  <input type=\"text\" name=\"username\" required>\n  <label>Password:<\/label>\n  <input type=\"password\" name=\"password\" required>\n  <button type=\"submit\">Login<\/button>\n<\/form>\n"}, "week06-cache-session-login/student_login_project/student_login_project/settings.py": {"kind": "text", "text": "# student_login_project/settings.py\n# Only the parts you change are shown. Keep everything else that\n# \"django-admin startproject\" generated.\n\n# Application definition\nINSTALLED_APPS = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'studentlogin',\n]\n\nTEMPLATES = [\n    {\n        'BACKEND': 'django.template.backends.django.DjangoTemplates',\n        'DIRS': [BASE_DIR / 'templates'],\n        'APP_DIRS': True,   # finds studentlogin/templates/\n        'OPTIONS': {\n            'context_processors': [\n                'django.template.context_processors.debug',\n                'django.template.context_processors.request',\n                'django.contrib.auth.context_processors.auth',\n                'django.contrib.messages.context_processors.messages',\n            ],\n        },\n    },\n]\n\n# Cache (in-memory, good for a lab demo)\nCACHES = {\n    \"default\": {\n        \"BACKEND\": \"django.core.cache.backends.locmem.LocMemCache\",\n        \"LOCATION\": \"student-cache\",\n    }\n}\n\n# Sessions are enabled by default\nSESSION_ENGINE = \"django.contrib.sessions.backends.db\"\n"}, "week06-cache-session-login/student_login_project/student_login_project/urls.py": {"kind": "text", "text": "# student_login_project/urls.py  (project level)\nfrom django.contrib import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', include('studentlogin.urls')),  # include app routes\n]\n"}, "week07-quiz-app/README.md": {"kind": "text", "text": "# Week 7 — Quiz Application with SQLite3\n\n**Aim:** Create a quiz application using the Django framework along with SQLite3.\n\n## Project structure\n\n```text\nquiz_app/\n├── manage.py\n├── quiz_app/              # settings & root urls\n├── quiz/                  # the quiz app\n│   ├── admin.py           # register Question, Choice\n│   ├── models.py          # Question, Choice\n│   ├── views.py           # quiz & result\n│   ├── urls.py\n│   └── templates/quiz/\n│       ├── quiz.html\n│       └── result.html\n├── db.sqlite3             # SQLite3 database file\n└── static/                # optional CSS, JS, images\n```\n\n## Steps\n\n1. **Create an environment and the project:**\n\n   ```bash\n   python -m venv week7\n   week7\\Scripts\\activate\n   pip install django\n   django-admin startproject quiz_app\n   cd quiz_app\n   python manage.py startapp quiz\n   mkdir static\n   ```\n\n2. **Edit settings** in [quiz_app/settings.py](open:week07-quiz-app/quiz_app/quiz_app/settings.py): add `'quiz'`, `TEMPLATES`, static folders, time zone `Asia/Kolkata` and the security flags. SQLite3 is Django's default database, so `DATABASES` stays as generated.\n3. **Write the models** in [quiz/models.py](open:week07-quiz-app/quiz_app/quiz/models.py). `Choice` links to `Question` with `related_name=\"choices\"`, so a template can loop over `question.choices.all`.\n4. **Create the tables:**\n\n   ```bash\n   python manage.py makemigrations\n   python manage.py migrate\n   ```\n\n5. **Register the models** in [quiz/admin.py](open:week07-quiz-app/quiz_app/quiz/admin.py).\n6. **Write the views** in [quiz/views.py](open:week07-quiz-app/quiz_app/quiz/views.py). `result_view` reads each answer with `request.POST.get(str(question.id))` and adds 1 for every choice with `is_correct=True`.\n7. **Map the URLs** in [quiz/urls.py](open:week07-quiz-app/quiz_app/quiz/urls.py) (app level) and [quiz_app/urls.py](open:week07-quiz-app/quiz_app/quiz_app/urls.py) (project level).\n8. **Create the templates** [quiz/templates/quiz/quiz.html](open:week07-quiz-app/quiz_app/quiz/templates/quiz/quiz.html) and [result.html](open:week07-quiz-app/quiz_app/quiz/templates/quiz/result.html). Each radio button's `name` is the question id and its `value` is the choice id.\n9. **Add questions.** Run `python manage.py createsuperuser`, open `/admin/`, add Questions, then add Choices and tick *Is correct* on the right one.\n10. **Run the project:**\n\n    ```bash\n    python manage.py runserver\n    ```\n\n    Answer at http://127.0.0.1:8000 ([quiz](open:week07-quiz-app/output/quiz-answered.jpg)) and see the score ([result](open:week07-quiz-app/output/result.jpg)).\n"}, "week07-quiz-app/quiz_app/quiz/admin.py": {"kind": "text", "text": "# quiz/admin.py\nfrom django.contrib import admin\nfrom .models import Question, Choice\n\nadmin.site.register(Question)\nadmin.site.register(Choice)\n"}, "week07-quiz-app/quiz_app/quiz/models.py": {"kind": "text", "text": "# quiz/models.py\nfrom django.db import models\n\nclass Question(models.Model):\n    text = models.CharField(max_length=255)\n\n    def __str__(self):\n        return self.text\n\nclass Choice(models.Model):\n    question = models.ForeignKey(Question, on_delete=models.CASCADE, related_name=\"choices\")\n    text = models.CharField(max_length=255)\n    is_correct = models.BooleanField(default=False)\n\n    def __str__(self):\n        return self.text\n"}, "week07-quiz-app/quiz_app/quiz/views.py": {"kind": "text", "text": "# quiz/views.py\nfrom django.shortcuts import render\nfrom .models import Question, Choice\n\ndef quiz_view(request):\n    questions = Question.objects.all()\n    return render(request, \"quiz/quiz.html\", {\"questions\": questions})\n\ndef result_view(request):\n    if request.method == \"POST\":\n        score = 0\n        questions = Question.objects.all()\n        for question in questions:\n            # Each question's input name should be its ID in the template\n            selected = request.POST.get(str(question.id))\n            if selected:\n                try:\n                    choice = Choice.objects.get(id=int(selected), question=question)\n                    if choice.is_correct:\n                        score += 1\n                except Choice.DoesNotExist:\n                    pass\n        return render(request, \"quiz/result.html\", {\n            \"score\": score,\n            \"total\": questions.count()\n        })\n    else:\n        # If someone visits result_view directly without POST\n        return render(request, \"quiz/result.html\", {\n            \"score\": 0,\n            \"total\": 0\n        })\n"}, "week07-quiz-app/quiz_app/quiz/urls.py": {"kind": "text", "text": "# quiz/urls.py  (app level - create this file)\nfrom django.urls import path\nfrom . import views\n\nurlpatterns = [\n    path('', views.quiz_view, name='quiz'),\n    path('result/', views.result_view, name='result'),\n]\n"}, "week07-quiz-app/quiz_app/quiz/templates/quiz/result.html": {"kind": "text", "text": "<h2>Your Score: {{ score }} / {{ total }}<\/h2>\n<a href=\"{% url 'quiz' %}\">Try Again<\/a>\n"}, "week07-quiz-app/quiz_app/quiz/templates/quiz/quiz.html": {"kind": "text", "text": "<form method=\"post\" action=\"{% url 'result' %}\">\n  {% csrf_token %}\n  {% for question in questions %}\n    <h3>{{ question.text }}<\/h3>\n    {% for choice in question.choices.all %}\n      <input type=\"radio\" name=\"{{ question.id }}\" value=\"{{ choice.id }}\">\n      {{ choice.text }}<br>\n    {% endfor %}\n  {% endfor %}\n  <button type=\"submit\">Submit<\/button>\n<\/form>\n"}, "week07-quiz-app/quiz_app/quiz_app/settings.py": {"kind": "text", "text": "# quiz_app/settings.py\n# Only the parts you change are shown. Keep everything else that\n# \"django-admin startproject\" generated.\n\nINSTALLED_APPS = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'quiz',  # our app\n]\n\nDEBUG = True  # Keep ON during development\nALLOWED_HOSTS = ['127.0.0.1', 'localhost']\n\nTEMPLATES = [\n    {\n        'BACKEND': 'django.template.backends.django.DjangoTemplates',\n        'DIRS': [BASE_DIR / \"templates\"],  # global templates folder\n        'APP_DIRS': True,\n        'OPTIONS': {\n            'context_processors': [\n                'django.template.context_processors.debug',\n                'django.template.context_processors.request',\n                'django.contrib.auth.context_processors.auth',\n                'django.contrib.messages.context_processors.messages',\n            ],\n        },\n    },\n]\n\nSTATIC_URL = '/static/'\nSTATICFILES_DIRS = [BASE_DIR / \"static\"]  # create a \"static\" folder next to manage.py\n\nLOGIN_REDIRECT_URL = '/'\nLOGOUT_REDIRECT_URL = '/'\n\nLANGUAGE_CODE = 'en-in'\nTIME_ZONE = 'Asia/Kolkata'\nUSE_I18N = True\nUSE_TZ = True\n\n# security\nCSRF_COOKIE_SECURE = True\nSESSION_COOKIE_SECURE = True\nSECURE_BROWSER_XSS_FILTER = True\n"}, "week07-quiz-app/quiz_app/quiz_app/urls.py": {"kind": "text", "text": "# quiz_app/urls.py  (project level)\nfrom django.contrib import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', include('quiz.urls')),\n]\n"}, "week10-weather-dashboard/README.md": {"kind": "text", "text": "# Week 10 — Weather Dashboard with Chart.js\n\n**Aim:** Create an application that fetches weather information from openweathermap.org and displays the current and historical weather as charts using Chart.js, implemented with Django.\n\n## Project structure\n\n```text\nweather_project/\n├── manage.py\n├── .env\n├── requirements.txt\n├── weather_project/\n│   ├── settings.py\n│   └── urls.py\n└── weather/\n    ├── urls.py\n    ├── views.py\n    ├── services.py          # calls the OpenWeatherMap API\n    ├── utils.py             # optional (from the manual)\n    ├── models.py            # WeatherSnapshot\n    ├── forms.py             # CityForm\n    ├── templates/weather/dashboard.html\n    └── static/weather/\n        ├── styles.css\n        └── charts.js\n```\n\n## Steps\n\n1. **Get an API key.** Sign up free at openweathermap.org, then copy your key from *My API keys*. A new key can take an hour or two to start working.\n2. **Create an environment, the project and the app:**\n\n   ```bash\n   python -m venv week10\n   week10\\Scripts\\activate\n   pip install django requests python-dotenv\n   django-admin startproject weather_project\n   cd weather_project\n   python manage.py startapp weather\n   ```\n\n3. **Add the text files** next to `manage.py`: [requirements.txt](open:week10-weather-dashboard/weather_project/requirements.txt) and [.env](open:week10-weather-dashboard/weather_project/.env). Put your real key after `OPENWEATHER_API_KEY=`.\n4. **Edit settings** in [weather_project/settings.py](open:week10-weather-dashboard/weather_project/weather_project/settings.py): load `.env` with `load_dotenv`, read `OPENWEATHER_API_KEY`, and add `\"weather\"` to `INSTALLED_APPS`.\n5. **Map the URLs** in [weather_project/urls.py](open:week10-weather-dashboard/weather_project/weather_project/urls.py) (project) and [weather/urls.py](open:week10-weather-dashboard/weather_project/weather/urls.py) (app).\n6. **Write the model** in [weather/models.py](open:week10-weather-dashboard/weather_project/weather/models.py). Each `WeatherSnapshot` row is one reading; together they are the history.\n7. **Write the API calls** in [weather/services.py](open:week10-weather-dashboard/weather_project/weather/services.py): `get_current_weather()` uses `/data/2.5/weather`, `get_forecast_5day()` uses `/data/2.5/forecast` (3-hour steps for 5 days). The manual's [utils.py](open:week10-weather-dashboard/weather_project/weather/utils.py) does a simpler version of the first call.\n8. **Write the form** in [weather/forms.py](open:week10-weather-dashboard/weather_project/weather/forms.py): a city box and an optional country code.\n9. **Write the view** in [weather/views.py](open:week10-weather-dashboard/weather_project/weather/views.py). On submit it fetches current weather and the forecast, saves a snapshot, and loads the last 30 snapshots for that city.\n10. **Create the template** [dashboard.html](open:week10-weather-dashboard/weather_project/weather/templates/weather/dashboard.html). `{{ forecast_points|json_script:\"forecast-data\" }}` safely hands the Python lists to JavaScript.\n11. **Add the static files** [charts.js](open:week10-weather-dashboard/weather_project/weather/static/weather/charts.js) (draws four line charts with Chart.js) and [styles.css](open:week10-weather-dashboard/weather_project/weather/static/weather/styles.css). The manual's sample chart is kept as [weather_trends_demo.html](open:week10-weather-dashboard/weather_trends_demo.html) — open it directly to see Chart.js work with fixed data.\n12. **Run the application:**\n\n    ```bash\n    pip install -r requirements.txt\n    python manage.py makemigrations\n    python manage.py migrate\n    python manage.py runserver\n    ```\n\n    Enter a city such as `Hyderabad` and press **Update**. Submit the same city a few times to build up the history chart.\n"}, "week10-weather-dashboard/weather_trends_demo.html": {"kind": "text", "text": "<!-- From the manual (Step 5): a standalone Chart.js demo with sample data.\n     Open this file directly in a browser to see the \"Weather Trends\" chart. -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Weather Trends<\/title>\n<\/head>\n<body>\n  <h2>Weather Trends<\/h2>\n\n  <canvas id=\"weatherChart\"><\/canvas>\n\n  <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"><\/script>\n  <script>\n    // These arrays come from your Django context\n    const labels = [\"2026-01-20 18:00\", \"2026-01-20 19:00\", \"2026-01-20 20:00\"];\n    const tempData = [24.5, 23.8, 22.9];\n    const humidityData = [60, 65, 70];\n    const windData = [3.2, 2.8, 2.5];\n\n    new Chart(document.getElementById('weatherChart'), {\n      type: 'line',\n      data: {\n        labels: labels,\n        datasets: [\n          {\n            label: 'Temperature (°C)',\n            data: tempData,\n            borderColor: 'red',\n            backgroundColor: 'rgba(255,0,0,0.2)',\n            fill: false,\n            tension: 0.3\n          },\n          {\n            label: 'Humidity (%)',\n            data: humidityData,\n            borderColor: 'blue',\n            backgroundColor: 'rgba(0,0,255,0.2)',\n            fill: false,\n            tension: 0.3\n          },\n          {\n            label: 'Wind Speed (m/s)',\n            data: windData,\n            borderColor: 'green',\n            backgroundColor: 'rgba(0,255,0,0.2)',\n            fill: false,\n            tension: 0.3\n          }\n        ]\n      },\n      options: {\n        responsive: true,\n        plugins: {\n          legend: { position: 'top' },\n          tooltip: { enabled: true }\n        },\n        scales: {\n          x: {\n            title: { display: true, text: 'Timestamp' }\n          },\n          y: {\n            title: { display: true, text: 'Values' }\n          }\n        }\n      }\n    });\n  <\/script>\n<\/body>\n<\/html>\n"}, "week10-weather-dashboard/weather_project/.env": {"kind": "text", "text": "DJANGO_SECRET_KEY=your-dev-secret\nOPENWEATHER_API_KEY=your_openweather_api_key\nDEBUG=True\nALLOWED_HOSTS=localhost,127.0.0.1\n"}, "week10-weather-dashboard/weather_project/requirements.txt": {"kind": "text", "text": "Django>=4.2\nrequests>=2.31\npython-dotenv>=1.0\n"}, "week10-weather-dashboard/weather_project/weather_project/settings.py": {"kind": "text", "text": "# weather_project/settings.py\n# Only the parts you change are shown. Replace the generated SECRET_KEY,\n# DEBUG and ALLOWED_HOSTS lines with these, and keep everything else.\nimport os\nfrom pathlib import Path\nfrom dotenv import load_dotenv\n\nBASE_DIR = Path(__file__).resolve().parent.parent\n\n# added: read the values from the .env file next to manage.py\nload_dotenv(BASE_DIR / \".env\")\n\nSECRET_KEY = os.getenv(\"DJANGO_SECRET_KEY\", \"dev-only-secret\")\nDEBUG = os.getenv(\"DEBUG\", \"False\") == \"True\"\nALLOWED_HOSTS = os.getenv(\"ALLOWED_HOSTS\", \"localhost,127.0.0.1\").split(\",\")\nOPENWEATHER_API_KEY = os.getenv(\"OPENWEATHER_API_KEY\", \"\")\n\nINSTALLED_APPS = [\n    \"django.contrib.admin\",\n    \"django.contrib.auth\",\n    \"django.contrib.contenttypes\",\n    \"django.contrib.sessions\",\n    \"django.contrib.messages\",\n    \"django.contrib.staticfiles\",\n    \"weather\",\n]\n"}, "week10-weather-dashboard/weather_project/weather_project/urls.py": {"kind": "text", "text": "# weather_project/urls.py  (project level)\nfrom django.contrib import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n    path(\"admin/\", admin.site.urls),\n    path(\"\", include(\"weather.urls\")),\n]\n"}, "week10-weather-dashboard/weather_project/weather/services.py": {"kind": "text", "text": "# weather/services.py  (create this file)\nimport requests\nfrom django.conf import settings\n\nBASE_URL = \"https://api.openweathermap.org/data/2.5\"\nAPI_KEY = settings.OPENWEATHER_API_KEY\n\ndef get_current_weather(city: str, country_code: str = \"\"):\n    if not API_KEY:\n        raise RuntimeError(\"Missing OPENWEATHER_API_KEY\")\n    q = f\"{city},{country_code}\" if country_code else city\n    url = f\"{BASE_URL}/weather\"\n    params = {\"q\": q, \"appid\": API_KEY, \"units\": \"metric\"}\n    r = requests.get(url, params=params, timeout=10)\n    r.raise_for_status()\n    data = r.json()\n    return {\n        \"city\": data[\"name\"],\n        \"lat\": data[\"coord\"][\"lat\"],\n        \"lon\": data[\"coord\"][\"lon\"],\n        \"temp_c\": data[\"main\"][\"temp\"],\n        \"humidity\": data[\"main\"][\"humidity\"],\n        \"wind_speed\": data[\"wind\"][\"speed\"],\n        \"description\": data[\"weather\"][0][\"description\"].title(),\n        \"icon\": data[\"weather\"][0][\"icon\"],\n    }\n\ndef get_forecast_5day(city: str, country_code: str = \"\"):\n    if not API_KEY:\n        raise RuntimeError(\"Missing OPENWEATHER_API_KEY\")\n    q = f\"{city},{country_code}\" if country_code else city\n    url = f\"{BASE_URL}/forecast\"\n    params = {\"q\": q, \"appid\": API_KEY, \"units\": \"metric\"}\n    r = requests.get(url, params=params, timeout=10)\n    r.raise_for_status()\n    data = r.json()\n    points = []\n    for item in data.get(\"list\", []):\n        points.append({\n            \"dt_txt\": item[\"dt_txt\"],\n            \"temp_c\": item[\"main\"][\"temp\"],\n            \"humidity\": item[\"main\"][\"humidity\"],\n            \"wind_speed\": item[\"wind\"][\"speed\"],\n        })\n    return points\n"}, "week10-weather-dashboard/weather_project/weather/models.py": {"kind": "text", "text": "# weather/models.py\nfrom django.db import models\nfrom django.core.validators import MinValueValidator, MaxValueValidator\n\nclass WeatherSnapshot(models.Model):\n    city = models.CharField(max_length=100)\n    country_code = models.CharField(max_length=2, blank=True)  # e.g., \"IN\"\n    timestamp = models.DateTimeField(auto_now_add=True)\n    temp_c = models.FloatField(\n        validators=[MinValueValidator(-100), MaxValueValidator(60)]\n    )\n    humidity = models.IntegerField(\n        validators=[MinValueValidator(0), MaxValueValidator(100)]\n    )\n    wind_speed = models.FloatField(\n        validators=[MinValueValidator(0)]\n    )\n\n    class Meta:\n        ordering = [\"-timestamp\"]\n        indexes = [\n            models.Index(fields=[\"city\"]),\n            models.Index(fields=[\"timestamp\"]),\n        ]\n\n    def __str__(self):\n        return f\"{self.city} ({self.country_code}) - {self.temp_c}°C at {self.timestamp:%Y-%m-%d %H:%M}\"\n"}, "week10-weather-dashboard/weather_project/weather/forms.py": {"kind": "text", "text": "# weather/forms.py  (create this file)\nfrom django import forms\n\n# changed: the manual's CityForm was a dropdown filled from saved\n# WeatherSnapshot rows, which is empty the first time you run the app.\n# A text box lets you type any city.\nclass CityForm(forms.Form):\n    city = forms.CharField(label=\"City\", max_length=100)\n    country_code = forms.CharField(label=\"Country code\", max_length=2, required=False,\n                                   help_text=\"Optional, e.g. IN\")\n"}, "week10-weather-dashboard/weather_project/weather/views.py": {"kind": "text", "text": "# weather/views.py\n# changed: the manual's weather_chart_view rendered \"weather/chart.html\",\n# but urls.py imports \"dashboard\" and dashboard.html expects current,\n# forecast_points and historical_points. This view supplies exactly those.\nimport requests\nfrom django.contrib import messages\nfrom django.shortcuts import render\nfrom django.utils.timezone import localtime\nfrom .forms import CityForm\nfrom .models import WeatherSnapshot\nfrom .services import get_current_weather, get_forecast_5day\n\ndef dashboard(request):\n    current = None\n    forecast_points = []\n    historical_points = []\n\n    if request.method == \"POST\":\n        form = CityForm(request.POST)\n        if form.is_valid():\n            city = form.cleaned_data[\"city\"].strip()\n            country_code = form.cleaned_data[\"country_code\"].strip().upper()\n            try:\n                current = get_current_weather(city, country_code)\n                forecast_points = get_forecast_5day(city, country_code)\n\n                # Save a snapshot so the \"historical\" chart grows each time\n                WeatherSnapshot.objects.create(\n                    city=current[\"city\"],\n                    country_code=country_code,\n                    temp_c=current[\"temp_c\"],\n                    humidity=current[\"humidity\"],\n                    wind_speed=current[\"wind_speed\"],\n                )\n            except RuntimeError as e:\n                messages.error(request, str(e))\n            except requests.RequestException:\n                messages.error(request, f\"Could not get weather for '{city}'. Check the city name and your API key.\")\n\n            if current:\n                qs = WeatherSnapshot.objects.filter(city=current[\"city\"]).order_by(\"-timestamp\")[:30]\n                historical_points = [\n                    {\n                        \"time\": localtime(s.timestamp).strftime(\"%Y-%m-%d %H:%M\"),\n                        \"temp_c\": s.temp_c,\n
