<!-- NOT IN THE MANUAL: index.html links to registration.html, but the manual does not give this page.
     This is a simple page in the same Bootstrap style, using CSS Grid for the two-column fields. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Shopping Cart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <style>
    body { background: #f4f7f8; }
    .page { min-height: 80vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 560px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    @media (max-width: 576px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">Shopping Cart</a>
  </nav>

  <div class="page">
    <div class="card auth-card p-4">
      <h3 class="text-center mb-3">Create an Account</h3>
      <form id="registerForm">
        <div class="grid-2">
          <div class="form-group">
            <label for="username">User Name</label>
            <input type="text" class="form-control" id="username" required>
          </div>
          <div class="form-group">
            <label for="email">Mail-id</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <div class="form-group">
            <label for="contact">Contact Number</label>
            <input type="tel" class="form-control" id="contact" pattern="[0-9]{10}" placeholder="10-digit number" required>
          </div>
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <textarea class="form-control" id="address" rows="2" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>
      <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function (event) {
      event.preventDefault();
      alert("Registration successful!");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
