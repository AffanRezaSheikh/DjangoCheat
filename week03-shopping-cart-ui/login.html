<!-- NOT IN THE MANUAL: index.html links to login.html, but the manual does not give this page.
     This is a simple page in the same Bootstrap style, using Flexbox to centre the form. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Shopping Cart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <style>
    body { padding-top: 0; background: #f4f7f8; }
    .page { min-height: 80vh; display: flex; justify-content: center; align-items: center; }
    .auth-card { width: 100%; max-width: 400px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">Shopping Cart</a>
  </nav>

  <div class="page">
    <div class="card auth-card p-4">
      <h3 class="text-center mb-3">Login</h3>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">User Name</label>
          <input type="text" class="form-control" id="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <p class="text-center mt-3 mb-0">New user? <a href="registration.html">Register here</a></p>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      alert("Login successful!");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
